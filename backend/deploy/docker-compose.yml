# Windmill backend, one VPS. Postgres holds the data, a one-shot applies the schema,
# the two service binaries run from the same published image, and Caddy terminates TLS
# and reverse-proxies both. Only Caddy is exposed to the internet; everything else talks
# over the private compose network by service name.
#
# Values come from ./.env (rendered by the deploy workflow from GitHub secrets/vars).

name: windmill

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: windmill
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: windmill
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U windmill -d windmill"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: ghcr.io/neigrok/windmill-monorepo:${IMAGE_TAG:-latest}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGCONNECT_TIMEOUT: "10"
    command: >
      psql "postgresql://windmill:${POSTGRES_PASSWORD}@db:5432/windmill"
      -v ON_ERROR_STOP=1 -f /app/db/schema.sql

  server:
    image: ghcr.io/neigrok/windmill-monorepo:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      embedder:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://windmill:${POSTGRES_PASSWORD}@db:5432/windmill
      PORT: "8080"
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # Verified Resend sender, and the one key here with no fallback on purpose. Every other empty value
      # below turns its feature honestly dark; Resend's shared `onboarding@resend.dev` would instead keep
      # sign-in mail working for exactly one recipient — the account owner — and reject every stranger,
      # which is an outage that passes every check the owner can run. Empty fails for everyone or not at
      # all; the deploy guard keeps it from ever rendering empty here.
      RESEND_FROM: ${RESEND_FROM:-}
      # Paste-import LLM escalation (/v1/compose). Empty → the route answers 503 compose-unavailable
      # and the client hides the handle.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Journal voice (Talk), bought from OpenAI gpt-4o-transcribe. Empty → the transcribe route
      # answers 503 and the client hides Talk. Set it to arm voice for Windmill One subscribers.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Journal echoes. BOTH boundaries must be wired or the nightly pass is a quiet no-op: the
      # embedder sidecar below, and ANTHROPIC_API_KEY above (shared with paste-import — one account,
      # two products asking it different questions). Unset URL → echoes stay dark, and nothing is
      # written, so arming later costs a re-derivation and never a wrong row.
      JOURNAL_EMBEDDER_URL: ${JOURNAL_EMBEDDER_URL:-http://embedder:8081}
      # The operator's rehearsal door for one nightly pass. Unset → the route 403s, its resting state.
      JOURNAL_ECHO_ADMIN_TOKEN: ${JOURNAL_ECHO_ADMIN_TOKEN:-}
      # Tending (server-side agent edits). Ships DARK: empty/absent → every run refuses with
      # "not turned on", the designed first face. Set to "true" to arm it once the agent loop lands.
      TENDING_ENABLED: ${TENDING_ENABLED:-}
      # Resend's Svix signing secret for the delivery webhook: a permanent bounce or a spam complaint
      # suppresses that address's weekly reminder. Empty → POST /v1/resend/webhook refuses every
      # delivery, so the door is dark rather than forgeable (the PADDLE_WEBHOOK_SECRET stance).
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      # The reminder engine's arming pair, plus the manual-sweep bearer. All three were MISSING here
      # until 2026-08-02, so the engine could not be armed in prod at all — the allowlist was
      # unreachable rather than empty. Defaults keep it dark: nothing sends while ENABLED is unset,
      # and an empty ALLOWLIST means NOBODY by design, not by accident. Unset ADMIN_TOKEN 404s the
      # manual sweep route, which is its resting state — the heartbeat does not need it.
      REMINDERS_ENABLED: ${REMINDERS_ENABLED:-}
      REMINDERS_ALLOWLIST: ${REMINDERS_ALLOWLIST:-}
      REMINDERS_ADMIN_TOKEN: ${REMINDERS_ADMIN_TOKEN:-}
      # Journal's nightly nudge — the same arming pair, its own rehearsal bearer, the same dark
      # defaults, and the same rule: EMPTY ALLOWLIST MEANS NOBODY. ENABLED alone arms no one and a
      # list alone sends nothing, so the two can be set in either order and neither can launch the
      # feature by itself. Naming an id here is also what makes journal's nudge settings panel
      # appear for that account at all — the panel renders on the `armed` flag this gate answers —
      # so the allowlist is the whole distance between dark and launched, not just a mail filter.
      # These three reached NO container until 2026-08-05: absent here AND absent from deploy.yml's
      # render list, which is the same defect the reminder block above records. Both lists.
      JOURNAL_NUDGE_ENABLED: ${JOURNAL_NUDGE_ENABLED:-}
      JOURNAL_NUDGE_ALLOWLIST: ${JOURNAL_NUDGE_ALLOWLIST:-}
      JOURNAL_NUDGE_ADMIN_TOKEN: ${JOURNAL_NUDGE_ADMIN_TOKEN:-}
      # Observability: uncaught server exceptions AND every LOG_* line ship to Sentry (empty DSN →
      # both no-op; stdout is never affected, so `docker logs` stays whole either way). LOG_LEVEL is
      # the volume knob, ENVIRONMENT keeps a non-prod run out of the environment you page on, and
      # RELEASE is the deployed sha. Funnel events forward to Amplitude with the resolved user_id
      # (empty key → skipped); HOST picks the region.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_LOG_LEVEL: ${SENTRY_LOG_LEVEL:-info}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      AMPLITUDE_API_KEY: ${AMPLITUDE_API_KEY:-}
      AMPLITUDE_HOST: ${AMPLITUDE_HOST:-api2.amplitude.com}
      # How long the three telemetry tables keep a row (days). Empty ⇒ the binary's defaults —
      # events 180, feedback 365, server errors 180 — and a value of 0 or less keeps that table
      # forever, skipping it whole. Nothing here reaches user content: trees, journal pages, gym
      # rows and users are unreachable from the retention store by construction.
      WINDMILL_EVENTS_RETENTION_DAYS: ${WINDMILL_EVENTS_RETENTION_DAYS:-}
      WINDMILL_FEEDBACK_RETENTION_DAYS: ${WINDMILL_FEEDBACK_RETENTION_DAYS:-}
      WINDMILL_SERVER_ERROR_RETENTION_DAYS: ${WINDMILL_SERVER_ERROR_RETENTION_DAYS:-}
      # Google sign-in (second door onto wm_session). Empty → the /auth/google routes stay dark.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Paddle billing. The webhook secret belongs to ONE notification destination — sandbox and
      # production have separate destinations and separate secrets. Empty → every delivery is
      # refused (and retried), so billing is dark rather than forgeable.
      PADDLE_WEBHOOK_SECRET: ${PADDLE_WEBHOOK_SECRET:-}
      PADDLE_API_KEY: ${PADDLE_API_KEY:-}
      PADDLE_ENV: ${PADDLE_ENV:-sandbox}
      PADDLE_PRICE_ID: ${PADDLE_PRICE_ID:-}
      # Magic links point at the app; the session cookie is first-party on the single origin.
      WINDMILL_APP_URL: https://${DOMAIN_APP}
      WINDMILL_COOKIE_DOMAIN: ${DOMAIN_APP}
      # Single origin: the app IS the API host. This is the OAuth issuer and, by default, the MCP
      # resource audience — windmill_server serves REST + socket + /mcp in-process on this host.
      WINDMILL_API_URL: https://${DOMAIN_APP}
      WINDMILL_MCP_ALLOWED_ORIGINS: ${WINDMILL_MCP_ALLOWED_ORIGINS:-}
      WINDMILL_MCP_TOKEN: ${WINDMILL_MCP_TOKEN:-}
      # The /t/:id share pages read the built SPA shell from here (the same host dir Caddy
      # serves) to splice in each shared tree's own unfurl meta for social scrapers.
      WINDMILL_WEB_ROOT: /srv/windmill-web
    volumes:
      - ./web:/srv/windmill-web:ro
    command: ["windmill_server"]
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # The standalone `mcp` service is retired: windmill_server now serves REST, the collab socket,
  # and MCP from one process against a single RoomRegistry, so an agent's edits and the web reader
  # share the same live room. (The windmill_mcp_http binary still builds for local/standalone use.)

  # The journal echo embedder. Runs the SAME bge-small weights the browser downloads — the model
  # is bind-mounted from ./web, the built site Caddy already serves, so the sidecar reads the exact
  # bytes the device does. Measured server-vs-browser agreement is 0.999978 cosine against a float32
  # ceiling of 0.9999995; reimplementing the pooling in C++ would have risked a silent divergence
  # that raises no error and just makes retrieval quietly worse forever.
  #
  # Consequence worth knowing: on a fresh host the WEB deploy must land before this service starts,
  # or the mount is empty and /health reports 503 naming the missing path (the container stays up).
  #
  # The code is an IMAGE built by Backend CI/CD from services/embedder — the same package as the
  # server, tagged `embedder-<sha>`, pulled by the same IMAGE_TAG — since 2026-08-15. Until then this
  # was `node:22-slim` with services/embedder bind-mounted from the host, a directory the deploy
  # never copied to the VPS, so the sidecar could not start on any host nobody had hand-provisioned.
  # A rollback to a sha older than that has no embedder image at its tag; dispatch with a newer one.
  embedder:
    image: ghcr.io/neigrok/windmill-monorepo:embedder-${IMAGE_TAG:-latest}
    restart: unless-stopped
    volumes:
      - ./web/models:/models:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8081/health').then(r=>r.json()).then(j=>process.exit(j.status==='ready'?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN_API: ${DOMAIN_API}
      DOMAIN_APP: ${DOMAIN_APP:-app.localhost}
      ACME_EMAIL: ${ACME_EMAIL}
      # Cloudflare's edge ranges — the allow-list for the Caddyfile's (cloudflare_only) gate, which
      # is the only thing making CF-Connecting-IP trustworthy. The deploy workflow fetches the live
      # list and renders it into .env; this default is what an unset variable falls back to, and it
      # is the real list rather than the allow-all it used to be — an allow-all default meant any
      # deploy that missed the variable shipped an open origin and said nothing (2026-08-16 audit,
      # INFRA-1). Failing closed onto a slightly stale edge list is the better failure: worst case a
      # newly-added Cloudflare range gets 403s until this line is refreshed, which is visible and
      # recoverable, whereas an open origin is neither. NEVER write an empty value here: Caddy
      # starts fine on an empty remote_ip matcher and then 403s every request, Cloudflare's included
      # (measured) — a full outage. `:-` rather than `-` is what keeps an empty .env line off it.
      # Source: https://api.cloudflare.com/client/v4/ips — fetched 2026-08-22, etag 38f79d050aa027e3be3865e495dcc9bc
      CF_IPS: "${CF_IPS:-173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22 2400:cb00::/32 2606:4700::/32 2803:f800::/32 2405:b500::/32 2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/windmill-web:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
