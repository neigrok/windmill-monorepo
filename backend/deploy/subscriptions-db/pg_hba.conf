# windmill_subscriptions, the subscription service's database: its own role reaches it over the
# network, the backend's role `windmill` reaches it by no path, and its role reaches no other database.
# A rule here applies to a superuser too, which REVOKE CONNECT does not.
local   windmill_subscriptions   windmill                                  reject
host    windmill_subscriptions   windmill                 all              reject
host    windmill_subscriptions   windmill_subscriptions   all              scram-sha-256
host    all                      windmill_subscriptions   all              reject
