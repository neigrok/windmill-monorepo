# windmill_subscriptions, the subscription service's database: the backend's role `windmill` reaches it
# by no path, its own role reaches it with its password over the network and the cluster's socket alike,
# and its role reaches no other database. A rule here binds a superuser, which REVOKE CONNECT does not.
local   windmill_subscriptions   windmill                                  reject
host    windmill_subscriptions   windmill                 all              reject
local   windmill_subscriptions   windmill_subscriptions                    scram-sha-256
host    windmill_subscriptions   windmill_subscriptions   all              scram-sha-256
local   all                      windmill_subscriptions                    reject
host    all                      windmill_subscriptions   all              reject
