[package]
name = "app_store"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
domain = { path = "../domain" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
x509-parser = "0.18.1"

[dev-dependencies]
axum = "0.8.9"
rcgen = "0.14.10"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["macros", "net", "rt", "time"] }

[lints]
workspace = true
