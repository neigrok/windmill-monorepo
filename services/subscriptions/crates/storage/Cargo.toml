[package]
name = "storage"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
domain = { path = "../domain" }

# `macros` and `migrate` embed migrations/ in the binary, and `macros` derives the row types. No query here is
# checked against a database at compile time, so a build needs none.
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-ring-webpki", "uuid"] }
tokio = { version = "1.54.1", features = ["time"] }
url = "2.5.8"
uuid = { version = "1.18.1", features = ["v4"] }

[dev-dependencies]
futures-util = "0.3.31"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
