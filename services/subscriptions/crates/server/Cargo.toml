[package]
name = "server"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "subscriptions"
path = "src/main.rs"

[dependencies]
app_store = { path = "../app_store" }
domain = { path = "../domain" }
storage = { path = "../storage" }

axum = "0.8.9"
futures-util = "0.3.31"
sentry = { version = "0.49.5", default-features = false, features = ["backtrace", "contexts", "logs", "reqwest", "rustls", "tracing"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["net", "rt-multi-thread", "signal", "time"] }
tokio-util = "0.7.15"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json"] }
uuid = { version = "1.18.1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros"] }
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
