[package]
name = "server"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "subscriptions"
path = "src/main.rs"

[dependencies]
app_store = { path = "../app_store" }
domain = { path = "../domain" }
storage = { path = "../storage" }

axum = "0.8.9"
futures-util = "0.3.31"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["server-graceful", "service", "tokio"] }
reqwest = { version = "0.13.5", default-features = false }
sentry = { version = "0.49.5", default-features = false, features = ["backtrace", "contexts", "logs", "reqwest", "rustls", "tracing"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-util = "0.7.15"
tower-http = { version = "0.6.11", features = ["limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json"] }
uuid = { version = "1.18.1", features = ["v4"] }

[dev-dependencies]
sentry = { version = "0.49.5", default-features = false, features = ["test"] }
# The contract tests compare the doors' bodies with the fixtures byte for byte, so the fixtures' key order is kept.
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio"] }
tokio = { version = "1.54.1", features = ["io-util"] }
tower = { version = "0.5.3", features = ["util"] }
url = "2.5.8"

[lints]
workspace = true
