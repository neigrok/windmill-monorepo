[package]
name = "ai-storage"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ai-domain = { path = "../domain" }
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-ring-webpki"] }
tokio = { version = "1.54.1", features = ["sync", "time"] }
uuid = { version = "1.18.1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[[test]]
name = "ledger"
path = "../../tests/ledger.rs"

[lints]
workspace = true
