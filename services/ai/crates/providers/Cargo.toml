[package]
name = "ai-providers"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[dependencies]
base64 = "0.23.1"
chacha20poly1305 = "0.10.1"
futures-util = "0.3.31"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "io-util"] }
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }
zeroize = "1.8.2"

[dev-dependencies]
static_assertions = "1.1.0"

[lints]
workspace = true

[[test]]
name = "anthropic"
path = "tests/anthropic.rs"

[[test]]
name = "realtime"
path = "tests/realtime.rs"
