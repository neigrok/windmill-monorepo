[package]
name = "ai-server"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "windmill-ai"
path = "src/main.rs"

[dependencies]
ai-domain = { path = "../domain" }
ai-storage = { path = "../storage" }
ai-providers = { path = "../providers" }
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22.1"
ed25519-dalek = "2.2.0"
futures-util = "0.3.31"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["server-graceful", "service", "tokio"] }
reqwest = { version = "0.13.5", default-features = false }
sentry = { version = "0.49.5", default-features = false, features = ["backtrace", "contexts", "logs", "reqwest", "rustls", "tracing"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "time", "sync"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
tokio-util = "0.7.15"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json"] }
uuid = { version = "1.18.1", features = ["v4"] }
url = "2.5"
toml = "0.9"

[dev-dependencies]
sentry = { version = "0.49.5", default-features = false, features = ["test"] }
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
