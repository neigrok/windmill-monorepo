name: Purge cutover evidence

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type PURGE_CUTOVER_EVIDENCE to irreversibly delete the server cutover copies
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Confirm irreversible purge
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRM" != PURGE_CUTOVER_EVIDENCE ]]; then
            printf 'FAIL confirm must be PURGE_CUTOVER_EVIDENCE\n' >&2
            exit 1
          fi
      - name: List, purge and verify cutover evidence on the VPS
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SSH_KEY" > "$key"
          chmod 600 "$key"
          ssh -i "$key" -p "${SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new \
            -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "$SSH_USER@$SSH_HOST" 'timeout --kill-after=10s 300s bash -seuo pipefail' <<'REMOTE'
          main() {
            trap 'printf "FAIL cutover evidence purge interrupted\n" >&2; exit 1' HUP INT TERM
            if [[ -L "$HOME/windmill" || -L "$HOME/windmill/migration-evidence" ]]; then
              printf 'FAIL cutover evidence path must not be a symlink\n' >&2
              return 1
            fi
            cd -P -- "$HOME/windmill"
            [[ "$PWD" == "$HOME/windmill" ]]
            if [[ ! -e migration-evidence ]]; then
              printf 'before: entries=0 files=0 directories=0 symlinks=0 bytes=0\n'
              printf 'after: entries=0 files=0 directories=0 symlinks=0 bytes=0\n'
              printf 'PASS cutover evidence directory is absent\n'
              return
            fi
            [[ -d migration-evidence ]]
            cd -P -- migration-evidence
            [[ "$PWD" == "$HOME/windmill/migration-evidence" ]]
            device=$(stat -c '%d' .)
            if ! find -P . -xdev -mindepth 1 -printf '%D\n' 2>/dev/null |
              awk -v device="$device" '$1 != device {different = 1} END {exit different}'; then
              printf 'FAIL cutover evidence inventory failed or crosses a filesystem boundary\n' >&2
              return 1
            fi
            inventory() {
              printf '%s: ~/windmill/migration-evidence/\n' "$1"
              find -P . -xdev -mindepth 1 -maxdepth 1 -print0 2>/dev/null |
                while IFS= read -r -d '' entry; do
                  if [[ "$entry" == ./cutover.lock || "$entry" == ./active-cutover ||
                        "$entry" == ./active-cutover.tmp ||
                        "$entry" =~ ^\./products-cutover-[0-9]{8}T[0-9]{6}Z-[A-Za-z0-9]{6}$ ]]; then
                    printf '%s\n' "$entry"
                  else
                    printf '[redacted top-level entry]\n'
                  fi
                done || return 1
              find -P . -xdev -mindepth 1 -printf '%y %s\n' 2>/dev/null |
                awk '{entries++; if ($1 == "f") {files++; bytes += $2}
                  if ($1 == "d") directories++; if ($1 == "l") symlinks++}
                  END {printf "entries=%d files=%d directories=%d symlinks=%d bytes=%.0f\n",
                    entries, files, directories, symlinks, bytes}' || return 1
            }
            if ! inventory before; then
              printf 'FAIL cutover evidence inventory failed\n' >&2
              return 1
            fi
            status=0
            find -P . -xdev -mindepth 1 -depth -delete 2>/dev/null || status=$?
            if ! inventory after; then
              printf 'FAIL remaining cutover evidence inventory failed\n' >&2
              return 1
            fi
            if ! remaining=$(find -P . -xdev -mindepth 1 -printf x 2>/dev/null | wc -c); then
              printf 'FAIL remaining cutover evidence count failed\n' >&2
              return 1
            fi
            if [[ "$status" -ne 0 || "$remaining" -ne 0 ]]; then
              printf 'FAIL cutover evidence remains\n' >&2
              return 1
            fi
            printf 'PASS cutover evidence directory is empty\n'
          }
          main < /dev/null
          REMOTE
