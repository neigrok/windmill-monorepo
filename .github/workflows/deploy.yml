name: Deploy to VPS

# Renders the whole ~/windmill/.env on the VPS, ships compose + Caddyfile, pulls the images, brings
# the stack up. Adding a key is TWO edits: the `env:` block below AND the key list in the render
# loop. A key in `env:` but absent from that list is never written and the compose default stands in
# silently; a key in the list but not in `env:` aborts the run under `set -u`.

on:
  workflow_run:
    workflows: [Backend CI/CD]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Full main commit SHA of the image to deploy
        required: true
        type: string
      expected_old_minimum:
        description: Exact live sync minimum for a coordinated change (0 for a fresh host)
        type: string
      expected_new_minimum:
        description: Exact candidate sync minimum for a coordinated change
        type: string
      expected_image_id:
        description: Exact sha256 Docker image content ID for a coordinated change
        type: string

# The lock is taken under the same condition the job runs under. A run this workflow skips (a pull
# request's or a red Backend CI/CD) waits nowhere, so it cannot cancel a deploy that is waiting.
concurrency:
  group: >-
    ${{ ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
         (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.event == 'push'))
        && 'deploy-vps' || format('deploy-skipped-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  deploy:
    # The push clause matters: a pull_request run of Backend CI/CD skips build-and-push, so its
    # success describes a tag that was never published.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Under workflow_run, checkout defaults to the branch head, not the triggering commit.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Render .env + deploy the stack
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          # Guarded (emptiness breaks the site or the DB):
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          # The password of windmill_subscriptions, the subscription service's database role: the
          # subscriptions-db one-shot sets it and the service signs in with it (backend/deploy/README.md).
          SUBSCRIPTIONS_DB_PASSWORD: ${{ secrets.SUBSCRIPTIONS_DB_PASSWORD }}
          # The bearer secret of the subscription service's internal doors, handed to the server and the service.
          # Empty ⇒ the server's feed follower stays off and the doors answer 401 (backend/deploy/README.md).
          SUBSCRIPTIONS_INTERNAL_TOKEN: ${{ secrets.SUBSCRIPTIONS_INTERNAL_TOKEN }}
          # The App Store Server API's in-app purchase key (.p8 PEM); unset ⇒ claims and refreshes answer 503.
          SUBSCRIPTIONS_APP_STORE_API_PRIVATE_KEY: ${{ secrets.SUBSCRIPTIONS_APP_STORE_API_PRIVATE_KEY }}
          AI_DB_PASSWORD: ${{ secrets.AI_DB_PASSWORD }}
          AI_PASS_KEYS: ${{ vars.AI_PASS_KEYS || '{}' }}
          AI_CARRY_KEY: ${{ secrets.AI_CARRY_KEY }}
          AI_FUNDING_SECRET: ${{ secrets.AI_FUNDING_SECRET }}
          AI_OPERATOR_SECRET: ${{ secrets.AI_OPERATOR_SECRET }}
          AI_ANTHROPIC_KEY: ${{ secrets.AI_ANTHROPIC_KEY }}
          AI_OPENAI_KEY: ${{ secrets.AI_OPENAI_KEY }}
          AI_AZURE_KEY: ${{ secrets.AI_AZURE_KEY }}
          AI_AZURE_URL: ${{ vars.AI_AZURE_URL }}
          AI_AZURE_DEPLOYMENT: ${{ vars.AI_AZURE_DEPLOYMENT }}
          DOMAIN_APP: ${{ vars.DOMAIN_APP }}
          DOMAIN_API: ${{ vars.DOMAIN_API }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          # Optional shared MCP bearer — /mcp stays gated by OAuth + per-user keys when this is empty:
          WINDMILL_MCP_TOKEN: ${{ secrets.WINDMILL_MCP_TOKEN }}
          # Service API keys (compose defaults them empty ⇒ that feature stays dark):
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Resend's Svix signing secret. Empty ⇒ the webhook endpoint refuses every delivery.
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AMPLITUDE_API_KEY: ${{ secrets.AMPLITUDE_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: ${{ vars.SENTRY_ENVIRONMENT || 'production' }}
          SENTRY_LOG_LEVEL: ${{ vars.SENTRY_LOG_LEVEL || 'info' }}
          SENTRY_RELEASE: ${{ inputs.image_tag || github.event.workflow_run.head_sha }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
          PADDLE_WEBHOOK_SECRET: ${{ secrets.PADDLE_WEBHOOK_SECRET }}
          # Bearer for POST /v1/admin/reminders/sweep. Unset ⇒ that route 404s.
          REMINDERS_ADMIN_TOKEN: ${{ secrets.REMINDERS_ADMIN_TOKEN }}
          # Bearers for POST /v1/admin/journal/{nudge,echo}/sweep. Unset ⇒ each route 403s.
          JOURNAL_NUDGE_ADMIN_TOKEN: ${{ secrets.JOURNAL_NUDGE_ADMIN_TOKEN }}
          JOURNAL_ECHO_ADMIN_TOKEN: ${{ secrets.JOURNAL_ECHO_ADMIN_TOKEN }}
          WINDMILL_OWNER_EMAILS: ${{ vars.WINDMILL_OWNER_EMAILS }}
          # Config (variables; safe compose defaults when unset):
          # Windmill One's sandbox testers and the stores its paid line is open on. Unset ⇒ none, and closed.
          WINDMILL_SANDBOX_EMAILS: ${{ vars.WINDMILL_SANDBOX_EMAILS }}
          SUBSCRIPTIONS_PURCHASABLE_STORES: ${{ vars.SUBSCRIPTIONS_PURCHASABLE_STORES }}
          SUBSCRIPTIONS_APP_STORE_API_ISSUER_ID: ${{ vars.SUBSCRIPTIONS_APP_STORE_API_ISSUER_ID }}
          SUBSCRIPTIONS_APP_STORE_API_KEY_ID: ${{ vars.SUBSCRIPTIONS_APP_STORE_API_KEY_ID }}
          PADDLE_ENV: ${{ vars.PADDLE_ENV }}
          PADDLE_PRICE_ID: ${{ vars.PADDLE_PRICE_ID }}
          RESEND_FROM: ${{ vars.RESEND_FROM }}
          AMPLITUDE_HOST: ${{ vars.AMPLITUDE_HOST }}
          # Every Domain the session cookie was set in before DOMAIN_APP, comma-separated (backend/AUTH.md). Empty ⇒ none.
          WINDMILL_COOKIE_RETIRED_DOMAINS: ${{ vars.WINDMILL_COOKIE_RETIRED_DOMAINS }}
          # Retention windows for the telemetry tables (days; <=0 keeps a table forever and skips it).
          WINDMILL_EVENTS_RETENTION_DAYS: ${{ vars.WINDMILL_EVENTS_RETENTION_DAYS }}
          WINDMILL_FEEDBACK_RETENTION_DAYS: ${{ vars.WINDMILL_FEEDBACK_RETENTION_DAYS }}
          WINDMILL_SERVER_ERROR_RETENTION_DAYS: ${{ vars.WINDMILL_SERVER_ERROR_RETENTION_DAYS }}
          TENDING_ENABLED: ${{ vars.TENDING_ENABLED }}
          AI_ALLOWANCES_ENABLED: ${{ vars.AI_ALLOWANCES_ENABLED || 'false' }}
          AI_INSTALLATIONS_ENABLED: ${{ vars.AI_INSTALLATIONS_ENABLED || 'false' }}
          AI_INSTALLATION_IP_HMAC_KEY: ${{ secrets.AI_INSTALLATION_IP_HMAC_KEY }}
          AI_INSTALLATION_ISSUES_PER_DAY: ${{ vars.AI_INSTALLATION_ISSUES_PER_DAY || '10' }}
          AI_INSTALLATION_GENERATIONS_PER_HOUR: ${{ vars.AI_INSTALLATION_GENERATIONS_PER_HOUR || '30' }}
          COACH_MAX_OUTPUT_TOKENS: ${{ vars.COACH_MAX_OUTPUT_TOKENS || '2000' }}
          AI_ANONYMOUS_LIFETIME_USD: ${{ vars.AI_ANONYMOUS_LIFETIME_USD || '0.25' }}
          AI_LOGGED_IN_MONTHLY_USD: ${{ vars.AI_LOGGED_IN_MONTHLY_USD || '0.50' }}
          AI_ONE_PERIOD_USD: ${{ vars.AI_ONE_PERIOD_USD || '7' }}
          AI_FREE_MONTHLY_USD: ${{ vars.AI_FREE_MONTHLY_USD || '100' }}
          AI_FREE_DAILY_USD: ${{ vars.AI_FREE_DAILY_USD || '5' }}
          AI_ALLOWANCE_ALERT_EMAIL: ${{ vars.AI_ALLOWANCE_ALERT_EMAIL || '' }}
          # The reminder engine's arming pair: an empty allowlist means NOBODY, so ENABLED alone
          # arms no account.
          REMINDERS_ENABLED: ${{ vars.REMINDERS_ENABLED }}
          REMINDERS_ALLOWLIST: ${{ vars.REMINDERS_ALLOWLIST }}
          # Same rule for nudges; naming an id also reveals journal's nudge settings panel to that account.
          JOURNAL_NUDGE_ENABLED: ${{ vars.JOURNAL_NUDGE_ENABLED }}
          JOURNAL_NUDGE_ALLOWLIST: ${{ vars.JOURNAL_NUDGE_ALLOWLIST }}
          APPLE_NATIVE_ENABLED: ${{ vars.APPLE_NATIVE_ENABLED || '0' }}
          APPLE_CLIENT_ID: ${{ vars.APPLE_CLIENT_ID || '' }}
          WINDMILL_MCP_ALLOWED_ORIGINS: ${{ vars.WINDMILL_MCP_ALLOWED_ORIGINS }}
          IMAGE_TAG: ${{ inputs.image_tag || github.event.workflow_run.head_sha }}
          SYNC_DEPLOY_MODE: ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'automatic' }}
          SYNC_OLD_MINIMUM: ${{ inputs.expected_old_minimum }}
          SYNC_NEW_MINIMUM: ${{ inputs.expected_new_minimum }}
          SYNC_IMAGE_ID: ${{ inputs.expected_image_id }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_TAG" =~ ^[a-f0-9]{40}$ ]]; then
            echo 'Refusing deploy: image_tag must be a full commit SHA.' >&2
            exit 1
          fi
          if ! git cat-file -e "$IMAGE_TAG^{commit}" 2>/dev/null ||
             ! git merge-base --is-ancestor "$IMAGE_TAG" origin/main; then
            echo 'Refusing deploy: the selected image commit must be reachable from origin/main.' >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          Path("sync-cutover.json").write_text(json.dumps({
              "mode": os.environ["SYNC_DEPLOY_MODE"],
              "oldMinimum": os.environ["SYNC_OLD_MINIMUM"],
              "newMinimum": os.environ["SYNC_NEW_MINIMUM"],
              "imageId": os.environ["SYNC_IMAGE_ID"]}) + "\n")
          PY

          # Cloudflare's edge ranges, fetched live, falling back to the committed compose default
          # rather than a second copy of the list. Must never render empty: an empty remote_ip matcher
          # makes Caddy 403 every request, Cloudflare's included.
          cf_default=$(sed -n 's/^ *CF_IPS: "[$]{CF_IPS:-\(.*\)}"$/\1/p' backend/deploy/docker-compose.yml)
          if [ -z "$cf_default" ]; then
            echo "Refusing to render — cannot read the committed CF_IPS default out of backend/deploy/docker-compose.yml"
            exit 1
          fi
          CF_IPS=$(curl -sf --max-time 20 https://api.cloudflare.com/client/v4/ips \
            | jq -r 'if .success then ((.result.ipv4_cidrs + .result.ipv6_cidrs) | join(" ")) else "" end' || true)
          if [ -n "$CF_IPS" ]; then
            echo "CF_IPS: fetched live from api.cloudflare.com"
          else
            CF_IPS="$cf_default"
            echo "CF_IPS: fetch failed — falling back to the committed list in docker-compose.yml"
          fi

          # This render overwrites ~/windmill/.env wholesale (only POSTGRES_PASSWORD is preserved), so
          # refuse before touching the host if anything whose emptiness would break prod is unset.
          # RESEND_FROM is guarded because its compose fallback `onboarding@resend.dev` is Resend's
          # shared test sender: it delivers to the account owner and to nobody else.
          missing=
          for key in DOMAIN_APP DOMAIN_API ACME_EMAIL POSTGRES_PASSWORD SUBSCRIPTIONS_DB_PASSWORD AI_DB_PASSWORD AI_CARRY_KEY AI_FUNDING_SECRET AI_OPERATOR_SECRET RESEND_FROM CF_IPS; do
            [ -n "${!key}" ] || missing="$missing $key"
          done
          if [ -n "$missing" ]; then
            echo "Refusing to render — these required values are unset:$missing"
            echo "Set them (variables for the domains/email/sender, the database passwords and AI service secrets) and re-run."
            echo "(CF_IPS is not configured anywhere — if it is listed, both the live fetch and the compose fallback came back empty.)"
            exit 1
          fi

          # The role's password sits unescaped in the subscription service's postgres:// URL.
          if [[ ! "$SUBSCRIPTIONS_DB_PASSWORD" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Refusing to render — SUBSCRIPTIONS_DB_PASSWORD must be 64 lowercase hex characters (openssl rand -hex 32)."
            exit 1
          fi
          # A bearer secret is written to .env as it is, so it holds nothing compose would read as markup.
          if [[ -n "$SUBSCRIPTIONS_INTERNAL_TOKEN" && ! "$SUBSCRIPTIONS_INTERNAL_TOKEN" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Refusing to render — SUBSCRIPTIONS_INTERNAL_TOKEN must be empty or 64 lowercase hex characters (openssl rand -hex 32)."
            exit 1
          fi

          python3 - <<'PYAI'
          import base64
          import json
          import os
          import re
          def refuse():
              raise SystemExit("Refusing to render — AI database, carry, public keys or internal secrets are invalid.")
          if not re.fullmatch(r"[0-9a-f]{64}", os.environ.get("AI_DB_PASSWORD", "")):
              refuse()
          carry = os.environ.get("AI_CARRY_KEY", "")
          if not re.fullmatch(r"[A-Za-z0-9_-]{43}", carry):
              refuse()
          try:
              raw = base64.urlsafe_b64decode(carry + "=")
              if len(raw) != 32 or base64.urlsafe_b64encode(raw).decode().rstrip("=") != carry:
                  refuse()
              keys = json.loads(os.environ.get("AI_PASS_KEYS") or "{}")
              if not isinstance(keys, dict):
                  refuse()
              for kid, key in keys.items():
                  if not re.fullmatch(r"[a-z0-9-]{1,32}", kid) or kid.startswith("test-") or not isinstance(key, str) or not re.fullmatch(r"[A-Za-z0-9_-]{43}", key):
                      refuse()
                  if len(base64.urlsafe_b64decode(key + "=")) != 32:
                      refuse()
          except (ValueError, TypeError):
              refuse()
          secrets = [os.environ.get(key, "") for key in ("AI_FUNDING_SECRET", "AI_OPERATOR_SECRET")]
          if any(not re.fullmatch(r"[A-Za-z0-9_-]{32,256}", value) for value in secrets) or len(set([carry, *secrets])) != 3:
              refuse()
          for key, value in os.environ.items():
              if key.startswith("AI_") and any(character in value for character in "\r\n$"):
                  refuse()
          PYAI

          if [ "$AI_INSTALLATIONS_ENABLED" = true ] || [ "$AI_INSTALLATIONS_ENABLED" = 1 ]; then
            if { [ "$AI_ALLOWANCES_ENABLED" != true ] && [ "$AI_ALLOWANCES_ENABLED" != 1 ]; } || [ "${#AI_INSTALLATION_IP_HMAC_KEY}" -lt 32 ]; then
              echo "Refusing to render — anonymous AI requires enabled allowances and the installation network secret."
              exit 1
            fi
          fi

          # The stores the paid line is open on (docs/foundation/subscriptions.md §5.3). A server given a name it does not
          # know keeps that store closed, so a typo is refused here, before anything reaches the host.
          stores='^ *((app_store|play_store|paddle) *(,|$) *)*$'
          if [[ ! "${SUBSCRIPTIONS_PURCHASABLE_STORES:-}" =~ $stores ]]; then
            echo "Refusing to render — SUBSCRIPTIONS_PURCHASABLE_STORES must list app_store, play_store or paddle, comma-separated."
            exit 1
          fi

          # printf so values are written literally. Optional keys write empty; compose defaults apply.
          : > rendered.env
          {
            printf 'IMAGE_TAG=%s\n' "${IMAGE_TAG:-latest}"
            for key in POSTGRES_PASSWORD SUBSCRIPTIONS_DB_PASSWORD SUBSCRIPTIONS_INTERNAL_TOKEN AI_DB_PASSWORD AI_PASS_KEYS AI_CARRY_KEY \
                       AI_FUNDING_SECRET AI_OPERATOR_SECRET AI_ANTHROPIC_KEY AI_OPENAI_KEY AI_AZURE_KEY \
                       AI_AZURE_URL AI_AZURE_DEPLOYMENT DOMAIN_APP DOMAIN_API ACME_EMAIL CF_IPS \
                       RESEND_API_KEY RESEND_FROM RESEND_WEBHOOK_SECRET ANTHROPIC_API_KEY OPENAI_API_KEY \
                       TENDING_ENABLED COACH_MAX_OUTPUT_TOKENS AI_ALLOWANCES_ENABLED AI_ANONYMOUS_LIFETIME_USD \
                       AI_LOGGED_IN_MONTHLY_USD AI_ONE_PERIOD_USD AI_FREE_MONTHLY_USD \
                       AI_FREE_DAILY_USD AI_ALLOWANCE_ALERT_EMAIL \
                       AI_INSTALLATIONS_ENABLED AI_INSTALLATION_IP_HMAC_KEY \
                       AI_INSTALLATION_ISSUES_PER_DAY AI_INSTALLATION_GENERATIONS_PER_HOUR \
                       SENTRY_DSN SENTRY_ENVIRONMENT SENTRY_LOG_LEVEL \
                       SENTRY_RELEASE AMPLITUDE_API_KEY AMPLITUDE_HOST \
                       WINDMILL_EVENTS_RETENTION_DAYS WINDMILL_FEEDBACK_RETENTION_DAYS \
                       WINDMILL_SERVER_ERROR_RETENTION_DAYS \
                       GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET \
                       PADDLE_WEBHOOK_SECRET PADDLE_API_KEY PADDLE_ENV PADDLE_PRICE_ID \
                       REMINDERS_ENABLED REMINDERS_ALLOWLIST REMINDERS_ADMIN_TOKEN \
                       JOURNAL_NUDGE_ENABLED JOURNAL_NUDGE_ALLOWLIST JOURNAL_NUDGE_ADMIN_TOKEN \
                       JOURNAL_ECHO_ADMIN_TOKEN \
                       APPLE_NATIVE_ENABLED APPLE_CLIENT_ID \
                       WINDMILL_OWNER_EMAILS WINDMILL_SANDBOX_EMAILS SUBSCRIPTIONS_PURCHASABLE_STORES \
                       SUBSCRIPTIONS_APP_STORE_API_ISSUER_ID SUBSCRIPTIONS_APP_STORE_API_KEY_ID \
                       WINDMILL_COOKIE_RETIRED_DOMAINS \
                       WINDMILL_MCP_ALLOWED_ORIGINS WINDMILL_MCP_TOKEN; do
              printf '%s=%s\n' "$key" "${!key}"
            done
            # A PEM spans lines, which one .env line cannot hold; the service reads it with its line breaks removed.
            printf 'SUBSCRIPTIONS_APP_STORE_API_PRIVATE_KEY=%s\n' "$(printf '%s' "${SUBSCRIPTIONS_APP_STORE_API_PRIVATE_KEY:-}" | tr -d '\r\n')"
          } >> rendered.env

          printf '%s\n' "$SSH_KEY" > deploy_key && chmod 600 deploy_key
          PORT="${SSH_PORT:-22}"
          SSH="ssh -i deploy_key -p ${PORT} -o StrictHostKeyChecking=accept-new"

          # A folder left by a refused candidate would take the next copy inside it, so it goes first.
          $SSH "$SSH_USER@$SSH_HOST" 'mkdir -p ~/windmill && rm -rf ~/windmill/subscriptions-db.next ~/windmill/ai-db.next'
          scp -i deploy_key -P "${PORT}" -o StrictHostKeyChecking=accept-new \
            backend/deploy/deploy-production.sh backend/deploy/sync_compatibility.py sync-cutover.json rendered.env \
            "$SSH_USER@$SSH_HOST:windmill/"
          scp -r -i deploy_key -P "${PORT}" -o StrictHostKeyChecking=accept-new \
            backend/deploy/subscriptions-db "$SSH_USER@$SSH_HOST:windmill/subscriptions-db.next"
          scp -r -i deploy_key -P "${PORT}" -o StrictHostKeyChecking=accept-new \
            backend/deploy/ai-db "$SSH_USER@$SSH_HOST:windmill/ai-db.next"
          scp -i deploy_key -P "${PORT}" -o StrictHostKeyChecking=accept-new \
            backend/deploy/docker-compose.yml "$SSH_USER@$SSH_HOST:windmill/docker-compose.next.yml"
          scp -i deploy_key -P "${PORT}" -o StrictHostKeyChecking=accept-new \
            backend/deploy/Caddyfile "$SSH_USER@$SSH_HOST:windmill/Caddyfile.next"

          $SSH "$SSH_USER@$SSH_HOST" 'bash -seu' <<'REMOTE'
          main() {
            cd ~/windmill
            bash deploy-production.sh
          }
          main < /dev/null
          REMOTE
