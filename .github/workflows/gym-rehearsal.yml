name: Gym and journal migration rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Rehearse on the newest VPS backup
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SSH_KEY" > "$key"
          chmod 600 "$key"
          ssh -i "$key" -p "${SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$SSH_HOST" 'bash -seuo pipefail' <<'REMOTE'
          cd ~/windmill
          umask 077
          backup=$(find backups -maxdepth 1 -type f -name 'products-*.dump' -printf '%f\n' | LC_ALL=C sort | tail -1)
          test -n "$backup" || { printf 'FAIL no verified backup\n'; exit 1; }
          db=$(docker compose ps -q db)
          server=$(docker compose ps -q server)
          test -n "$db" && test -n "$server"
          image=$(docker inspect --format '{{.Image}}' "$server")
          throwaway="products_rehearsal_$(date -u +%Y%m%dT%H%M%S)_$$"
          cleanup() {
            status=$?
            trap - EXIT HUP INT TERM
            if ! docker compose exec -T db sh -ec \
              'dropdb --username="$POSTGRES_USER" --maintenance-db=postgres --if-exists --force "$1"' sh "$throwaway" > /dev/null 2>&1; then
              printf 'FAIL throwaway cleanup\n'
              status=1
            fi
            if [ "$status" -ne 0 ]; then printf 'FAIL gym and journal rehearsal\n'; fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 1' HUP INT TERM
          docker compose exec -T db sh -ec \
            'createdb --username="$POSTGRES_USER" --maintenance-db=postgres "$1"' sh "$throwaway" > /dev/null 2>&1
          docker compose exec -T db sh -ec \
            'pg_restore --username="$POSTGRES_USER" --dbname="$1" --no-owner --no-privileges --exit-on-error' \
            sh "$throwaway" < "backups/$backup" > /dev/null 2>&1
          export PGUSER PGPASSWORD PGHOST PGDATABASE DATABASE_URL WINDMILL_APP_URL
          export WINDMILL_OWNER_EMAILS JOURNAL_NUDGE_ENABLED JOURNAL_NUDGE_ALLOWLIST
          PGUSER=$(docker compose exec -T db printenv POSTGRES_USER)
          PGPASSWORD=$(docker compose exec -T db printenv POSTGRES_PASSWORD)
          PGHOST=127.0.0.1
          PGDATABASE="$throwaway"
          DATABASE_URL="host=127.0.0.1 dbname=$throwaway"
          WINDMILL_APP_URL=$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$server" | sed -n 's/^WINDMILL_APP_URL=//p')
          WINDMILL_OWNER_EMAILS=$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$server" | sed -n 's/^WINDMILL_OWNER_EMAILS=//p')
          JOURNAL_NUDGE_ENABLED=$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$server" | sed -n 's/^JOURNAL_NUDGE_ENABLED=//p')
          JOURNAL_NUDGE_ALLOWLIST=$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$server" | sed -n 's/^JOURNAL_NUDGE_ALLOWLIST=//p')
          docker run --rm --network "container:$db" \
            --tmpfs /evidence:rw,mode=700,uid=10001,gid=10001 \
            -e PGUSER -e PGPASSWORD -e PGHOST -e PGDATABASE -e DATABASE_URL -e WINDMILL_APP_URL \
            -e WINDMILL_OWNER_EMAILS -e JOURNAL_NUDGE_ENABLED -e JOURNAL_NUDGE_ALLOWLIST \
            "$image" sh -ec '
              if python3 /app/deploy/gym-migration/rehearse.py --bin-dir /usr/local/bin \
                --output /evidence/run --apply-adoption > /evidence/stdout 2> /evidence/stderr; then
                python3 -c '\''import json; r=json.load(open("/evidence/run/result.json")); print(json.dumps({k:v for k,v in r.items() if k != "nowMs"},sort_keys=True))'\''
              else
                printf "FAIL rehearsal gates\n"
                exit 1
              fi'
          REMOTE
