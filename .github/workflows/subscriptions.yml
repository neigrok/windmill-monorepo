name: Subscriptions CI

# The Windmill One subscription service (services/subscriptions): the crates' dependency rule,
# formatting, Clippy with warnings denied and the tests, the Postgres ones included, then the image
# built and driven once against a database of its own.

on:
  push:
    branches: [main]
    paths:
      - 'services/subscriptions/**'
      - '.github/workflows/subscriptions.yml'
      - '!services/subscriptions/**/*.md'
  pull_request:
    paths:
      - 'services/subscriptions/**'
      - '.github/workflows/subscriptions.yml'
      - '!services/subscriptions/**/*.md'
  workflow_dispatch:

concurrency:
  group: subscriptions-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: services/subscriptions

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The storage tests create and drop databases beside this one; without it they are ignored.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      SUBSCRIPTIONS_TEST_DATABASE_URL: postgresql://postgres:ci@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v5

      # With no argument, rustup installs the toolchain rust-toolchain.toml pins.
      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/subscriptions

      # Reads cargo metadata only, so a broken rule fails here before anything compiles.
      - name: The dependency rule
        run: ./check-dependencies.sh

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

  # The image from services/subscriptions/Dockerfile, built for Linux in release mode and run once beside
  # a Postgres: it migrates the empty database, becomes healthy, both listeners answer ready, the public
  # one answers no internal path, and SIGTERM stops it with exit code 0.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: services/subscriptions
          load: true
          tags: windmill-subscriptions:ci
          build-args: SENTRY_RELEASE=${{ github.sha }}
          cache-from: type=gha,scope=subscriptions
          cache-to: type=gha,scope=subscriptions,mode=max

      - name: Start the ledger's database
        run: |
          docker network create ci
          docker run -d --name ledger --network ci -e POSTGRES_USER=windmill_subscriptions \
            -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=windmill_subscriptions postgres:16
          for attempt in $(seq 1 30); do
            docker exec ledger pg_isready -h 127.0.0.1 -U windmill_subscriptions -d windmill_subscriptions && break
            sleep 1
          done
          docker exec ledger pg_isready -h 127.0.0.1 -U windmill_subscriptions -d windmill_subscriptions

      - name: Drive the container
        run: |
          docker run -d --name subscriptions --network ci -p 8082:8082 -p 8083:8083 -e SENTRY_ENVIRONMENT=ci \
            -e SUBSCRIPTIONS_DATABASE_URL=postgresql://windmill_subscriptions:ci@ledger:5432/windmill_subscriptions \
            windmill-subscriptions:ci
          for attempt in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' subscriptions)" = healthy ] && break
            sleep 1
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' subscriptions)" = healthy
          test "$(curl -fsS http://127.0.0.1:8082/health)" = '{"status":"ready"}'
          test "$(curl -fsS http://127.0.0.1:8083/health)" = '{"status":"ready"}'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8082/internal/v1/feed)" = 404
          docker stop subscriptions
          test "$(docker inspect -f '{{.State.ExitCode}}' subscriptions)" = 0
          docker logs subscriptions | grep '"message":"ledger open"'
          docker logs subscriptions | grep '"message":"stopped"'

      # Sentry's ingest here accepts every connection and never answers, so each send hangs until the
      # service gives up on it. The container must still exit 0 before Docker's 10 s kill.
      - name: Stop in time while Sentry never answers
        run: |
          python3 -c 'import socket; hole = socket.create_server(("0.0.0.0", 9478)); held = [hole.accept()[0] for _ in iter(int, 1)]' > /dev/null 2>&1 &
          docker run -d --name unanswered --network ci --add-host host.docker.internal:host-gateway -p 18083:8083 \
            -e SENTRY_ENVIRONMENT=ci -e SENTRY_DSN=http://public@host.docker.internal:9478/1 \
            -e SUBSCRIPTIONS_DATABASE_URL=postgresql://windmill_subscriptions:ci@ledger:5432/windmill_subscriptions \
            -e SUBSCRIPTIONS_PANIC_ROUTE_ENABLED=true windmill-subscriptions:ci
          for attempt in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:18083/health && break
            sleep 1
          done
          for panic in 1 2 3; do
            test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18083/debug/panic)" = 500
          done
          started=$(date +%s)
          docker stop unanswered
          elapsed=$(( $(date +%s) - started ))
          echo "stopped in ${elapsed}s"
          test "$(docker inspect -f '{{.State.ExitCode}}' unanswered)" = 0
          test "$elapsed" -lt 10

      - name: The containers' logs
        if: always()
        run: |
          docker logs subscriptions || true
          docker logs unanswered || true
          docker logs ledger || true
