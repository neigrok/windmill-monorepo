name: Coach contracts

on:
  push:
    branches: [main]
    paths:
      - 'packages/api-contract/agent/**'
      - 'packages/api-contract/ai/**'
      - 'packages/api-contract/gym/catalog-3.json'
      - 'packages/api-contract/gym/abilities-3/**'
      - 'packages/api-contract/gym/strict.py'
      - 'packages/api-contract/gym/strict_test.py'
      - 'packages/api-contract/roadmap/catalog.json'
      - 'packages/api-contract/roadmap/limits.json'
      - 'packages/api-contract/roadmap/abilities/**'
      - 'packages/api-contract/roadmap/check.py'
      - 'packages/api-contract/roadmap/check_test.py'
      - 'packages/api-contract/roadmap/domain/*-actions.json'
      - 'packages/api-contract/sync/roadmap.registry.json'
      - 'packages/api-contract/journal/talk/**'
      - 'packages/api-contract/sync/journal.registry.json'
      - 'backend/products/roadmap/domain/Command.h'
      - 'web/src/products/roadmap/domain/roadmapRules.js'
      - 'docs/foundation/roadmap-coach.md'
      - '.github/workflows/coach.yml'
      - '!packages/api-contract/**/*.md'
  pull_request:
    paths:
      - 'packages/api-contract/agent/**'
      - 'packages/api-contract/ai/**'
      - 'packages/api-contract/gym/catalog-3.json'
      - 'packages/api-contract/gym/abilities-3/**'
      - 'packages/api-contract/gym/strict.py'
      - 'packages/api-contract/gym/strict_test.py'
      - 'packages/api-contract/roadmap/catalog.json'
      - 'packages/api-contract/roadmap/limits.json'
      - 'packages/api-contract/roadmap/abilities/**'
      - 'packages/api-contract/roadmap/check.py'
      - 'packages/api-contract/roadmap/check_test.py'
      - 'packages/api-contract/roadmap/domain/*-actions.json'
      - 'packages/api-contract/sync/roadmap.registry.json'
      - 'packages/api-contract/journal/talk/**'
      - 'packages/api-contract/sync/journal.registry.json'
      - 'backend/products/roadmap/domain/Command.h'
      - 'web/src/products/roadmap/domain/roadmapRules.js'
      - 'docs/foundation/roadmap-coach.md'
      - '.github/workflows/coach.yml'
      - '!packages/api-contract/**/*.md'
  workflow_dispatch:

concurrency:
  group: coach-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Validate the AI wire
        run: python3 packages/api-contract/ai/check.py
      - name: Check the shared turn stories
        run: |
          python3 packages/api-contract/agent/generate.py --check
          python3 packages/api-contract/agent/check.py
      - name: Check the gym catalog against strict mode, its corpora against its schemas
        run: |
          python3 packages/api-contract/gym/strict.py
          python3 packages/api-contract/gym/strict_test.py
      - name: Check Roadmap Coach's catalog and vectors, and its caps against the backend's and the web's
        run: |
          python3 packages/api-contract/roadmap/check.py
          python3 packages/api-contract/roadmap/check_test.py
      - name: Check Journal Talk's stories against their declarations, the pause rule, the live wire and the mark's row
        run: |
          python3 packages/api-contract/journal/talk/generate.py --check
          python3 packages/api-contract/journal/talk/check.py --self-test
