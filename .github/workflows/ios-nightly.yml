name: iOS nightly

# Verification branch: the four Gym nightly geometry cases.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ios-nightly
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  TZ: UTC

jobs:
  ui-nightly:
    name: App UI tests (nightly)
    uses: ./.github/workflows/ios-ui-tests.yml
    with:
      shard: nightly
      timeout: 75
      nightly: true
      tests: >-
        -only-testing:WindmillUITests/GymNightlyFlowTests
