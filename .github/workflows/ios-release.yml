name: iOS release

# Signs the app and uploads it to App Store Connect, where it lands in TestFlight. Runs after iOS CI
# passes on a push to main — against the commit CI tested, not whatever main is by now — or by hand.
# project.yml carries no team and signing off; everything signing needs is passed on the command
# line here, from repository secrets, and the App Store Connect API key never outlives the job.

on:
  workflow_run:
    workflows: [iOS CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Two uploads never race for a build number; a queued release waits rather than cancelling one
# half-way through an upload.
concurrency:
  group: ios-release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/ios

jobs:
  upload:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    # App Store Connect accepts uploads built with Xcode 26 or later (the iOS 26 SDK). The image's
    # Xcodes live side by side, so the one that builds the release is named rather than defaulted.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Name the scratch paths
        run: |
          {
            echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
            echo "ARCHIVE_PATH=$RUNNER_TEMP/Windmill.xcarchive"
            echo "EXPORT_PATH=$RUNNER_TEMP/export"
            echo "EXPORT_OPTIONS=$RUNNER_TEMP/ExportOptions.plist"
          } >> "$GITHUB_ENV"

      # Windmill.xcodeproj is generated, never committed; project.yml is the checked-in half.
      - name: Generate the project from project.yml
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Write the App Store Connect key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          umask 077
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$ASC_KEY_PATH"

      # Automatic signing with -allowProvisioningUpdates: the API key lets xcodebuild fetch or create
      # the certificate and the profile (Associated Domains included) with no Xcode account signed in.
      # The build number is this workflow's run number, so every upload is a new build.
      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          IOS_SENTRY_DSN: ${{ secrets.IOS_SENTRY_DSN }}
        run: |
          xcodebuild archive -project Windmill.xcodeproj -scheme Windmill -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic CODE_SIGNING_ALLOWED=YES \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            IOS_SENTRY_DSN="$IOS_SENTRY_DSN"

      # destination=upload makes the export the upload: nothing is written to EXPORT_PATH but logs.
      # manageAppVersionAndBuildNumber is off so the build number stays the run number above.
      - name: Export and upload to App Store Connect
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$EXPORT_OPTIONS" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$EXPORT_OPTIONS"
          xcodebuild -exportArchive -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS" -exportPath "$EXPORT_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Delete the App Store Connect key
        if: always()
        run: rm -f "$ASC_KEY_PATH" "$EXPORT_OPTIONS"
