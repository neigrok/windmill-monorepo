name: iOS release

on:
  workflow_dispatch:

concurrency:
  group: ios-release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/ios/App

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      WM_APPLE_SIGN_IN_ENABLED: ${{ vars.IOS_APPLE_SIGN_IN_ENABLED || 'NO' }}
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version

      - name: Generate the project
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          IOS_SENTRY_DSN: ${{ secrets.IOS_SENTRY_DSN }}
        run: |
          brew install xcodegen
          python3 Tools/generate_project.py --release

      - name: Validate signing inputs and write the App Store Connect key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          test -n "$ASC_KEY_ID" || { echo 'ASC_KEY_ID is required.'; exit 1; }
          test -n "$ASC_ISSUER_ID" || { echo 'ASC_ISSUER_ID is required.'; exit 1; }
          test -n "$ASC_KEY_P8_BASE64" || { echo 'ASC_KEY_P8_BASE64 is required.'; exit 1; }
          umask 077
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          openssl pkey -in "$RUNNER_TEMP/AuthKey.p8" -noout

      # Automatic signing archives with a development profile; a device must be registered on the team.
      # App Store export re-signs that archive for distribution. Do not override the signing identity:
      # a command-line Apple Distribution identity also reaches SPM targets and breaks automatic signing.
      - name: Archive
        run: |
          xcodebuild archive -project Windmill.xcodeproj -scheme Windmill -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Windmill.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Retain release symbols
        uses: actions/upload-artifact@v4
        with:
          name: ios-dsyms-${{ github.run_number }}
          path: ${{ runner.temp }}/Windmill.xcarchive/dSYMs
          if-no-files-found: error
          retention-days: 30

      - name: Export and upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Windmill.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove the App Store Connect key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
