name: iOS release

on:
  workflow_dispatch:

concurrency:
  group: ios-release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/ios/App

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      WM_APPLE_SIGN_IN_ENABLED: ${{ vars.IOS_APPLE_SIGN_IN_ENABLED || 'NO' }}
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version

      - name: Generate the project
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          IOS_SENTRY_DSN: ${{ secrets.IOS_SENTRY_DSN }}
        run: |
          brew install xcodegen
          python3 Tools/generate_project.py --release

      - name: Validate signing inputs and write the App Store Connect key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          test -n "$ASC_KEY_ID" || { echo 'ASC_KEY_ID is required.'; exit 1; }
          test -n "$ASC_ISSUER_ID" || { echo 'ASC_ISSUER_ID is required.'; exit 1; }
          test -n "$ASC_KEY_P8_BASE64" || { echo 'ASC_KEY_P8_BASE64 is required.'; exit 1; }
          umask 077
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          openssl pkey -in "$RUNNER_TEMP/AuthKey.p8" -noout

      # Automatic signing reuses this one certificate. Only codesign may use its key; print its SHA-1, never its name.
      - name: Install the development signing certificate
        env:
          IOS_DEV_CERT_P12_BASE64: ${{ secrets.IOS_DEV_CERT_P12_BASE64 }}
          IOS_DEV_CERT_PASSWORD: ${{ secrets.IOS_DEV_CERT_PASSWORD }}
        run: |
          test -n "$IOS_DEV_CERT_P12_BASE64" || { echo 'IOS_DEV_CERT_P12_BASE64 is required.'; exit 1; }
          test -n "$IOS_DEV_CERT_PASSWORD" || { echo 'IOS_DEV_CERT_PASSWORD is required.'; exit 1; }
          umask 077
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"[[:space:]]*$//' > "$RUNNER_TEMP/user-keychains"
          printf '%s' "$IOS_DEV_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -f pkcs12 -P "$IOS_DEV_CERT_PASSWORD" \
            -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          search_list=("$keychain")
          while IFS= read -r path; do search_list+=("$path"); done < "$RUNNER_TEMP/user-keychains"
          security list-keychains -d user -s "${search_list[@]}"
          identities="$(security find-identity -v -p codesigning "$keychain")"
          identity_count="$(grep -cE '^ *[0-9]+\) [0-9A-F]{40} "' <<< "$identities" || true)"
          development_sha1="$(grep -E '^ *[0-9]+\) [0-9A-F]{40} "Apple Development: ' <<< "$identities" | awk '{ print $2 }' || true)"
          echo "Valid code-signing identities in the signing keychain: $identity_count"
          if [ "$identity_count" != 1 ] || [ -z "$development_sha1" ]; then
            echo 'Expected exactly one valid Apple Development identity. The certificate may have expired or been revoked,'
            echo 'IOS_DEV_CERT_P12_BASE64 may hold the wrong file, or it is not an Apple Development certificate with its key.'
            exit 1
          fi
          echo "Signing certificate SHA-1: $development_sha1"
          echo "SIGNING_CERT_SHA1=$development_sha1" >> "$GITHUB_ENV"

      # Automatic signing archives with a development profile; a device must be registered on the team.
      # App Store export re-signs that archive for distribution. Do not override the signing identity:
      # a command-line Apple Distribution identity also reaches SPM targets and breaks automatic signing.
      - name: Archive
        run: |
          xcodebuild archive -project Windmill.xcodeproj -scheme Windmill -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Windmill.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: The archive is signed with the stored certificate
        run: |
          shopt -s nullglob
          bundles=("$RUNNER_TEMP"/Windmill.xcarchive/Products/Applications/*.app)
          test ${#bundles[@]} -eq 1 || { echo 'The archive should hold exactly one app.'; exit 1; }
          bundles+=("${bundles[0]}"/PlugIns/*.appex)
          expected_sha1="$(tr '[:lower:]' '[:upper:]' <<< "$SIGNING_CERT_SHA1")"
          for bundle in "${bundles[@]}"; do
            codesign -d --extract-certificates="$RUNNER_TEMP/archive-cert-" "$bundle"
            signed_sha1="$(shasum -a 1 "$RUNNER_TEMP/archive-cert-0" | awk '{ print toupper($1) }')"
            rm -f "$RUNNER_TEMP"/archive-cert-*
            if [ "$signed_sha1" != "$expected_sha1" ]; then
              echo "${bundle##*/} is signed with certificate $signed_sha1, not the stored certificate $expected_sha1."
              echo 'Xcode signed with a different certificate, most likely one it just created: the stored certificate is not being picked up.'
              exit 1
            fi
            echo "${bundle##*/} is signed with the stored certificate."
          done

      - name: Retain release symbols
        uses: actions/upload-artifact@v4
        with:
          name: ios-dsyms-${{ github.run_number }}
          path: ${{ runner.temp }}/Windmill.xcarchive/dSYMs
          if-no-files-found: error
          retention-days: 30

      - name: Export and upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Windmill.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Read TestFlight processing and beta availability
        timeout-minutes: 12
        run: |
          swiftc -parse-as-library Tools/AppStoreBuildStatus.swift -o "$RUNNER_TEMP/app-store-build-status"
          app_plists=("$RUNNER_TEMP"/Windmill.xcarchive/Products/Applications/*.app/Info.plist)
          test ${#app_plists[@]} -eq 1 || { echo 'The archive should hold exactly one app plist.'; exit 1; }
          ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/app-store-build-status" \
            "${app_plists[0]}" "$RUNNER_TEMP/testflight-status.json"

      - name: Retain the TestFlight status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-status-${{ github.run_number }}
          path: ${{ runner.temp }}/testflight-status.json
          if-no-files-found: warn
          retention-days: 30

      - name: Remove the signing keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP"/archive-cert-*
          if [ -f "$RUNNER_TEMP/user-keychains" ]; then
            search_list=()
            while IFS= read -r path; do search_list+=("$path"); done < "$RUNNER_TEMP/user-keychains"
            security list-keychains -d user -s "${search_list[@]}" || true
            rm -f "$RUNNER_TEMP/user-keychains"
          fi
          if [ -e "$RUNNER_TEMP/signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          fi

      - name: Remove the App Store Connect key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
