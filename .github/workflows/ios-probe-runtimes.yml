name: iOS probe runtimes

# Evidence from runtimes this repo's Macs cannot run, on a branch that is never merged. The app is built as TestFlight
# builds it, with Xcode 27.1 and the iOS 27 SDK. Xcode 27.1 runs iOS 17 or later in Simulator, but the xcode-27 image
# carries iOS 27 runtimes alone and `xcodebuild -downloadPlatform iOS -buildVersion 18.x` answers that none is available,
# so the build travels to macos-15, whose Xcode 26.3 runs its iOS 18.6. A failing test fails no step: each job's summary
# tables the outcomes and its artifact keeps them for 7 days.

on:
  push:
    branches: [ios-probe-runtimes]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  TZ: UTC

jobs:
  # The Release app, as an archive builds it, and the Debug app with its UI tests and their xctestrun, for the simulator.
  build-27:
    name: Xcode 27.1 · the iOS 27 SDK build
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: apps/ios/App
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      IOS_SENTRY_DSN: https://nonproduction@example.invalid/1
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install xcodegen

      - name: Build the Release app and the UI tests
        timeout-minutes: 50
        run: |
          python3 Tools/generate_project.py
          xcodebuild build -project Windmill.xcodeproj -scheme Windmill -configuration Release \
            -destination 'generic/platform=iOS Simulator' ARCHS=arm64 -derivedDataPath "$RUNNER_TEMP/app-release"
          xcodebuild build-for-testing -project Windmill.xcodeproj -scheme Windmill \
            -destination 'generic/platform=iOS Simulator' ARCHS=arm64 -derivedDataPath "$RUNNER_TEMP/app-build"
          mkdir -p "$RUNNER_TEMP/handoff"
          tar -C "$RUNNER_TEMP/app-release/Build/Products" -czf "$RUNNER_TEMP/handoff/release.tgz" Release-iphonesimulator/Windmill.app
          tar -C "$RUNNER_TEMP/app-build/Build/Products" -czf "$RUNNER_TEMP/handoff/tests.tgz" .

      - name: Hand the builds to the iOS 18 job
        uses: actions/upload-artifact@v4
        with:
          name: build-27
          path: ${{ runner.temp }}/handoff
          retention-days: 1

  # The 27 SDK build on an iPhone on the newest iOS 18, in three parts side by side. The first part launches the Release
  # app with no test around it, then runs sign-in and hello, a page written, and a workout logged and saved. Each part
  # takes every third capture of the room's class, the captures of section 12's boards first, in runs of 20 while its job
  # has time. testFiveThousandSteps needs a Release build, so it is left out.
  ios18-room:
    name: iOS 18 · the 27 SDK build · part ${{ matrix.part }}
    needs: build-27
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    defaults:
      run:
        shell: bash
        working-directory: apps/ios/App
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      ROOM_OUT: ${{ github.workspace }}/evidence/ios18-room
    steps:
      - uses: actions/checkout@v5

      - name: Show the image's Xcodes and simulator runtimes
        run: |
          echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          ls -d /Applications/Xcode*
          env -u DEVELOPER_DIR xcrun simctl list runtimes

      - name: Select Xcode 26.3, which runs the iOS 18 runtime
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version

      - name: Take the 27 SDK builds
        uses: actions/download-artifact@v4
        with:
          name: build-27
          path: ${{ runner.temp }}/handoff

      - name: Unpack the builds
        run: |
          mkdir -p "$RUNNER_TEMP/app-release" "$RUNNER_TEMP/app-build/Build/Products"
          tar -C "$RUNNER_TEMP/app-release" -xzf "$RUNNER_TEMP/handoff/release.tgz"
          tar -C "$RUNNER_TEMP/app-build/Build/Products" -xzf "$RUNNER_TEMP/handoff/tests.tgz"
          plutil -extract DTSDKName raw "$RUNNER_TEMP/app-release/Release-iphonesimulator/Windmill.app/Info.plist"
          plutil -extract MinimumOSVersion raw "$RUNNER_TEMP/app-release/Release-iphonesimulator/Windmill.app/Info.plist"

      - name: Stop Spotlight indexing
        run: |
          sudo mdutil -a -i off || true
          mdutil -s /System/Volumes/Data

      - name: Create and prepare an iPhone on the newest iOS 18
        timeout-minutes: 10
        run: |
          RUNTIME=$(xcrun simctl list runtimes --json | python3 -c '
          import json, sys
          runtimes = [r for r in json.load(sys.stdin)["runtimes"] if r["platform"] == "iOS" and r["isAvailable"] and r["version"].split(".")[0] == "18"]
          print(max(runtimes, key=lambda r: [int(part) for part in r["version"].split(".")])["identifier"])')
          echo "Runtime: $RUNTIME"
          SIMULATOR=$(xcrun simctl create "Room iOS 18" com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro "$RUNTIME")
          echo "SIMULATOR=$SIMULATOR" >> "$GITHUB_ENV"
          python3 Tools/prepare_simulator.py "$SIMULATOR" || xcrun simctl bootstatus "$SIMULATOR" -b

      # The crash this probe looks for came at launch, before any test could drive the app: the Release app is installed
      # and launched alone, and still running 20 seconds later is the evidence.
      - name: Launch the Release app on iOS 18
        if: ${{ matrix.part == 1 }}
        timeout-minutes: 5
        run: |
          mkdir -p "$ROOM_OUT"
          xcrun simctl install "$SIMULATOR" "$RUNNER_TEMP/app-release/Release-iphonesimulator/Windmill.app"
          xcrun simctl launch "$SIMULATOR" works.windmill.app
          sleep 20
          xcrun simctl io "$SIMULATOR" screenshot "$ROOM_OUT/release-launch.png" || true
          if xcrun simctl spawn "$SIMULATOR" launchctl list | grep -q "UIKitApplication:works.windmill.app"; then
            outcome="running 20 s after launch"
          else
            outcome="NOT running 20 s after launch"
          fi
          echo "The Release app built with the iOS 27 SDK is $outcome on iOS 18." | tee -a "$GITHUB_STEP_SUMMARY"
          xcrun simctl terminate "$SIMULATOR" works.windmill.app || true
          xcrun simctl uninstall "$SIMULATOR" works.windmill.app

      # Xcode 26.3 runs the UI tests Xcode 27.1 built: sign-in and hello, a page written, and a workout logged and saved.
      - name: Run the app's flows
        if: ${{ matrix.part == 1 }}
        timeout-minutes: 30
        run: |
          mkdir -p "$ROOM_OUT/results"
          perl -e 'alarm shift; exec @ARGV' 1700 xcodebuild test-without-building \
            -xctestrun "$(ls "$RUNNER_TEMP"/app-build/Build/Products/*.xctestrun)" \
            -destination "platform=iOS Simulator,id=$SIMULATOR" -parallel-testing-enabled NO -testLanguage en -testRegion US \
            -resultBundlePath "$ROOM_OUT/results/flows.xcresult" \
            -only-testing:WindmillUITests/OfflineFlowTests -only-testing:WindmillUITests/JournalFlowTests \
            -only-testing:WindmillUITests/GymRecoveryFlowTests -only-testing:WindmillUITests/GymWorkoutFlowTests/testPagerAndAssembly \
            2>&1 | tee "$ROOM_OUT/flows.log" || true

      # Captures start until minute 78 of the job, which leaves its export and upload time before minute 90.
      - name: Run the room's captures
        timeout-minutes: 75
        env:
          CAPTURES_UNTIL_MINUTE: "78"
          PART: ${{ matrix.part }}
          FIRST_CAPTURES: >-
            testBoardAtRest testStepUpNext testNewStep testStepDeleteQuestion testDeleteQuestion testTitleMenu
            testRenaming testRoomMenu testLongPressMenu testStepMenu testSwipeRightRevealsComplete
            testSwipeLeftRevealsDelete testFindResults testFindNothing testKeyboardUp testSortAndFilterMenu
            testDeleteRoadmapQuestion
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys
          import time
          from pathlib import Path

          deadline = int(os.environ["JOB_STARTED"]) + int(os.environ["CAPTURES_UNTIL_MINUTE"]) * 60
          out = Path(os.environ["ROOM_OUT"])
          (out / "results").mkdir(parents=True, exist_ok=True)
          (out / "logs").mkdir(parents=True, exist_ok=True)
          xctestrun = next(Path(os.environ["RUNNER_TEMP"], "app-build/Build/Products").glob("*.xctestrun"))
          every = re.findall(r"^  func (test\w+)\(\)", Path("UITests/DesignCapture/RoadmapCaptures.swift").read_text(), re.M)
          first = os.environ["FIRST_CAPTURES"].split()
          if missing := [test for test in first if test not in every]:
              raise SystemExit(f"RoadmapCaptures has no {missing}")
          rest = [test for test in every if test not in first and test != "testFiveThousandSteps"]
          mine = (first + rest)[int(os.environ["PART"]) - 1::3]
          print(f"Part {os.environ['PART']} runs {len(mine)} of {len(first + rest)} captures.")
          runs = [mine[start:start + 20] for start in range(0, len(mine), 20)]
          seconds_per_test = 75
          for number, tests in enumerate(runs, 1):
              left = int(deadline - time.time())
              if left < 60 or (number > 1 and left < seconds_per_test * len(tests)):
                  skipped = [test for later in runs[number - 1:] for test in later]
                  print(f"::warning::{left // 60} minutes left, too few for the next {len(tests)} captures. Not run: {' '.join(skipped)}")
                  break
              started = time.time()
              command = ["perl", "-e", "alarm shift; exec @ARGV", str(left), "xcodebuild", "test-without-building",
                         "-xctestrun", str(xctestrun), "-destination", f"platform=iOS Simulator,id={os.environ['SIMULATOR']}",
                         "-parallel-testing-enabled", "NO", "-testLanguage", "en", "-testRegion", "US",
                         "-test-timeouts-enabled", "YES", "-default-test-execution-time-allowance", "240",
                         "-maximum-test-execution-time-allowance", "300",
                         "-resultBundlePath", str(out / "results" / f"room-captures-{number}.xcresult"),
                         *[f"-only-testing:WindmillUITests/RoadmapCaptures/{test}" for test in tests]]
              with open(out / "logs" / f"room-captures-{number}.log", "w") as log:
                  process = subprocess.Popen(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, stdin=subprocess.DEVNULL,
                                             text=True, env={**os.environ, "TEST_RUNNER_WM_DESIGN_CAPTURE": "1"})
                  for line in process.stdout:
                      sys.stdout.write(line)
                      log.write(line)
                  print(f"Run {number} of {len(runs)} ended with {process.wait()} after {int(time.time() - started)} s.")
              seconds_per_test = (time.time() - started) / len(tests)
          PY

      - name: Export the room's captures
        if: ${{ always() }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          sys.path.insert(0, "Tools")
          from export_design_captures import export

          out = Path(os.environ["ROOM_OUT"])
          captures = out / "captures"
          entries = []
          for result in sorted((out / "results").glob("room-captures-*.xcresult")):
              try:
                  entries += export(result, captures)
              except (OSError, ValueError, KeyError, subprocess.SubprocessError) as error:
                  print(f"::warning::{result.name}: {error}")
          captures.mkdir(parents=True, exist_ok=True)
          (captures / "capture-manifest.json").write_text(json.dumps(entries, indent=2) + "\n")
          print(f"Exported {len(entries)} named captures to {captures}")
          PY

      - name: Table the captures' results
        if: ${{ always() }}
        run: python3 ../../../probe/roadmap-design/results.py "$ROOM_OUT"/results/*.xcresult

      - name: Keep the room's captures and results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios18-room-${{ matrix.part }}
          path: ${{ env.ROOM_OUT }}
          retention-days: 7

      - name: Delete the simulator
        if: ${{ always() && env.SIMULATOR != '' }}
        timeout-minutes: 2
        run: xcrun simctl delete "$SIMULATOR"
