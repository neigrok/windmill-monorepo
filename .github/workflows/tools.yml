name: Tools CI

# The filter is all of tools/, so a new tool fires this workflow, but a new tool with tests needs its
# own job below. lift-import is the only one that ships a suite.

on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - '.github/workflows/tools.yml'
  pull_request:
    paths:
      - 'tools/**'
      - '.github/workflows/tools.yml'
  workflow_dispatch:

concurrency:
  group: tools-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lift-import:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/lift-import
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - run: npm test
