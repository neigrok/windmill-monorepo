name: Embedder CI

# A gate, not a deploy: the sidecar must keep producing the vectors in check/fixture.json, because
# every stored span carries the VERSION that made it and cosine between two embedding spaces is
# meaningless while looking like nothing is wrong. web/scripts/fetch-model.mjs arms it because that
# script is where the sidecar's weights come from. The browser worker is deliberately a different
# model now (services/embedder/embedder.js), and nothing in this job reads it, so it is no longer a
# trigger; check/browser.mjs, which proves that worker in a real browser, needs Chrome and stays a
# manual check.

on:
  push:
    branches: [main]
    paths:
      - 'services/embedder/**'
      - 'web/scripts/fetch-model.mjs'
      - '.github/workflows/embedder.yml'
  pull_request:
    paths:
      - 'services/embedder/**'
      - 'web/scripts/fetch-model.mjs'
      - '.github/workflows/embedder.yml'
  workflow_dispatch:

concurrency:
  group: embedder-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: services/embedder

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/embedder/package-lock.json

      # npm ci, never npm install: the lockfile's onnxruntime-node pin is what makes the fixture
      # reproducible.
      - run: npm ci

      # The weights are not in the repo; same cache key as web.yml, so either workflow can fill it.
      # The key names both models because the directory holds both: change the list in
      # web/scripts/fetch-model.mjs and the key changes with it, or a restored cache is short one.
      - name: Cache the self-hosted embedding models
        uses: actions/cache@v5
        with:
          path: web/public/models
          key: models-bge-small-en-v1.5-q8-plus-paraphrase-multilingual-MiniLM-L12-v2-q8

      # MODEL_DIR is unset: the sidecar defaults to this directory, which the deployed bind mount
      # reproduces.
      - name: Fetch the model files
        working-directory: web
        run: node scripts/fetch-model.mjs

      # check/fixture.json was generated on darwin/arm64, so the bar here is the 0.995 cosine floor
      # rather than bit equality: onnxruntime-node's macOS and Linux builds do not agree to the bit.
      # macOS vs Linux measured at 0.9974 under the previous model against this 0.995 floor. This
      # model has never been run on Linux: if it lands under the floor, regenerate the fixture on the
      # platform rather than lowering the bar.
      - name: Fixture — the six pinned sentences
        run: node check/fixture.mjs

      - name: Server — the process the backend talks to
        run: node check/server.mjs
