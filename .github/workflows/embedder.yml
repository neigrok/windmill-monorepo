name: Embedder CI

# Checks the sidecar's versioned vectors and HTTP boundary. check/browser.mjs verifies the
# separate browser model manually and requires Chrome.

on:
  push:
    branches: [main]
    paths:
      - 'services/embedder/**'
      - 'web/scripts/fetch-model.mjs'
      - '.github/workflows/embedder.yml'
  pull_request:
    paths:
      - 'services/embedder/**'
      - 'web/scripts/fetch-model.mjs'
      - '.github/workflows/embedder.yml'
  workflow_dispatch:

concurrency:
  group: embedder-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: services/embedder

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/embedder/package-lock.json

      # npm ci, never npm install: the lockfile's onnxruntime-node pin is what makes the fixture
      # reproducible.
      - run: npm ci

      # The weights are not in the repo; same cache key as web.yml, so either workflow can fill it.
      # The key names both models because the directory holds both: change the list in
      # web/scripts/fetch-model.mjs and the key changes with it, or a restored cache is short one.
      - name: Cache the self-hosted embedding models
        uses: actions/cache@v5
        with:
          path: web/public/models
          key: models-bge-small-en-v1.5-q8-plus-paraphrase-multilingual-MiniLM-L12-v2-q8

      # MODEL_DIR is unset: the sidecar defaults to this directory, which the deployed bind mount
      # reproduces.
      - name: Fetch the model files
        working-directory: web
        run: node scripts/fetch-model.mjs

      # check/fixture.json was generated on darwin/arm64, so the bar here is the 0.995 cosine floor
      # rather than bit equality: onnxruntime-node's macOS and Linux builds do not agree to the bit.
      - name: Fixture — the six pinned sentences
        run: node check/fixture.mjs

      - name: Server — the process the backend talks to
        run: node check/server.mjs
