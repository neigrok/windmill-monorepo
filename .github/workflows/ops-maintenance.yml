# By hand only: pause the whole site for a planned maintenance, or lift the pause (backend/deploy/README.md, "Pause the
# site"). Roadmap's cutover pauses and lifts the site itself; this is the door to lift the pause a cutover leaves when it
# fails after the server started on the engine, once what failed is fixed. It never runs beside a cutover.
name: Ops · maintenance

on:
  workflow_dispatch:
    inputs:
      switch:
        description: Pause or lift the site
        required: true
        type: choice
        options: [lift, pause]

permissions:
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pause or lift the site
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SWITCH: ${{ inputs.switch }}
          SITE: https://${{ vars.DOMAIN_APP }}
        run: |
          set -euo pipefail
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SSH_KEY" > "$key"
          chmod 600 "$key"
          case "$SWITCH" in
            pause) command='mkdir -p ~/windmill/maintenance && printf "paused by hand\n" > ~/windmill/maintenance/on'; state=paused ;;
            lift) command='rm -f ~/windmill/maintenance/on'; state=lifted ;;
            *) echo "The switch is pause or lift." >&2; exit 1 ;;
          esac
          ssh -i "$key" -p "${SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" "$command" < /dev/null
          for ((attempt = 0; attempt < 30; attempt++)); do
            status=$(curl --silent --output /dev/null --max-time 10 --write-out '%{http_code}' "$SITE/" || true)
            if { [ "$state" = paused ] && [ "$status" = 503 ]; } || { [ "$state" = lifted ] && [ "$status" != 503 ]; }; then
              echo "PASS maintenance: the site is $state; $SITE answers $status on its page"
              exit 0
            fi
            sleep 1
          done
          echo "FAIL maintenance: $SITE still answers $status" >&2
          exit 1
