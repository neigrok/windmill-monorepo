# By hand only, and never during a deploy: counts how the roadmap's pointers between trees meet one owned subtree
# per step, the engine's roadmaps by owner and visibility, and its pointers alive with no `opens` (backend/SPEC.md,
# Subtree inventory). The tool runs inside the live server container, reads the database that container already knows
# and never writes. Where few accounts hold pointers its counts are one person's private structure, and the visibility
# counts are one person's private facts even with no pointers. This repository's logs are public, so the counts are
# sealed on the runner to the owner's certificate, .github/ops/inventory-recipient.pem, and leave the runner only as
# the run's artifact, never in the log, where GitHub would mask any stretch of the block that matches a secret.
# Opening them is in backend/deploy/README.md.
name: Ops · subtree inventory

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: vps-ops
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github
          persist-credentials: false
      - name: Refuse while a deploy runs or waits to run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A deploy's migration alters `trees`; it would wait behind the inventory's read, and the roadmap's reads
          # behind it. A deploy is a run of a workflow whose concurrency can take the deploy-vps lock, read from the
          # workflows themselves; a pull request's run takes no lock and reaches no server, so it is not one.
          deploys=$(awk '/^concurrency:/ { inside = 1; next } /^[^ ]/ { inside = 0 } inside && /deploy-vps/ { print FILENAME }' \
            .github/workflows/*.yml | sort -u)
          if ! printf '%s\n' "$deploys" | grep -qx '.github/workflows/deploy.yml'; then
            echo "Deploy to VPS no longer names the deploy-vps lock where this looks, so a deploy cannot be told apart: refusing to run." >&2
            exit 1
          fi
          for workflow in $deploys; do
            for status in queued in_progress waiting requested pending; do
              runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$(basename "$workflow")" --status "$status" \
                --json event --jq '[.[] | select(.event != "pull_request")] | length')
              if [ "$runs" -ne 0 ]; then
                echo "Not during a deploy: $(basename "$workflow") has a run $status. Dispatch the inventory again once it has finished." >&2
                exit 1
              fi
            done
          done
      - name: Count the roadmap's pointers and visibility in the live database, sealed to the owner
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          sealed="$RUNNER_TEMP/subtree-inventory"
          mkdir "$sealed"
          printf '%s\n' "$SSH_KEY" > "$key"
          chmod 600 "$key"
          # The live server's counts, on stdout.
          count() {
            ssh -i "$key" -p "${SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new \
              "$SSH_USER@$SSH_HOST" 'bash -seuo pipefail' <<'REMOTE'
          # The whole script is read before it runs, and nothing it starts can read the rest of it from stdin.
          main() {
            cd ~/windmill
            # 3 is the image without the tool; any other failure is Docker's own, which says why itself.
            carried=0
            docker compose exec -T server sh -c 'command -v windmill_subtree_inventory > /dev/null || exit 3' || carried=$?
            if [ "$carried" -eq 3 ]; then
              echo "The live server image does not carry windmill_subtree_inventory: deploy a commit that does, then run this again." >&2
              exit 1
            fi
            if [ "$carried" -ne 0 ]; then exit "$carried"; fi
            docker compose exec -T server windmill_subtree_inventory
          }
          main < /dev/null
          REMOTE
          }
          # The counts go from ssh straight into the seal, so no plaintext reaches a file or the log. A pipe that fails
          # fails the step, and the artifact step keeps nothing.
          count | openssl smime -encrypt -aes256 -binary -outform PEM -out "$sealed/counts.pem" .github/ops/inventory-recipient.pem
          printf 'counts.pem: %s bytes\n' "$(wc -c < "$sealed/counts.pem" | tr -d ' ')"
          (cd "$sealed" && sha256sum counts.pem)

      - name: Keep the sealed counts for a day
        uses: actions/upload-artifact@v4
        with:
          name: subtree-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/subtree-inventory/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
