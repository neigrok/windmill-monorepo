name: Gym and journal production cutover and metadata upgrade

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Base adoption or the R118 gym metadata upgrade
        required: true
        type: choice
        default: adopt
        options:
          - adopt
          - upgrade-v5
      confirm:
        description: Type cut over gym and journal or upgrade gym metadata v5 for the selected operation
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Validate production confirmation and deployment switches
        id: validate
        env:
          CONFIRM: ${{ inputs.confirm }}
          OPERATION: ${{ inputs.operation }}
          GYM_ENGINE_WRITES: ${{ vars.GYM_ENGINE_WRITES || '0' }}
          JOURNAL_ENGINE_WRITES: ${{ vars.JOURNAL_ENGINE_WRITES || '0' }}
          GYM_WRITE_FREEZE: ${{ vars.GYM_WRITE_FREEZE || '0' }}
          JOURNAL_WRITE_FREEZE: ${{ vars.JOURNAL_WRITE_FREEZE || '0' }}
          SYNC_ENABLED: ${{ vars.SYNC_ENABLED || '0' }}
        run: |
          set -euo pipefail
          case "$OPERATION" in
            adopt)
              expected='cut over gym and journal'
              if [ "$SYNC_ENABLED" != 0 ]; then
                printf 'FAIL base adoption requires SYNC_ENABLED=0\n'
                exit 1
              fi
              ;;
            upgrade-v5)
              expected='upgrade gym metadata v5'
              case "$SYNC_ENABLED" in
                0|1) ;;
                *) printf 'FAIL SYNC_ENABLED must be 0 or 1\n'; exit 1 ;;
              esac
              ;;
            *) printf 'FAIL unsupported cutover operation\n'; exit 1 ;;
          esac
          if [ "$CONFIRM" != "$expected" ] ||
             [ "$GYM_ENGINE_WRITES" != 1 ] || [ "$JOURNAL_ENGINE_WRITES" != 1 ] ||
             [ "$GYM_WRITE_FREEZE" != 0 ] || [ "$JOURNAL_WRITE_FREEZE" != 0 ]; then
            printf 'FAIL production confirmation or deployment switches\n'
            exit 1
          fi
          printf 'sync_enabled=%s\n' "$SYNC_ENABLED" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
      - name: Stop writers, verify backup, migrate and audit before startup
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          OPERATION: ${{ inputs.operation }}
          SYNC_ENABLED: ${{ steps.validate.outputs.sync_enabled }}
        run: |
          set -euo pipefail
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SSH_KEY" > "$key"
          chmod 600 "$key"
          scp -q -i "$key" -P "${SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new \
            backend/deploy/gym-migration/cutover-production.sh \
            "$SSH_USER@$SSH_HOST:windmill/products-cutover.sh"
          # Switch values passed the exact guards above.
          operation=adopt
          if [ "$OPERATION" = upgrade-v5 ]; then operation=--upgrade-v5; fi
          ssh -i "$key" -p "${SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$SSH_HOST" \
            "GYM_ENGINE_WRITES=1 JOURNAL_ENGINE_WRITES=1 GYM_WRITE_FREEZE=0 JOURNAL_WRITE_FREEZE=0 SYNC_ENABLED=$SYNC_ENABLED bash -seuo pipefail -- $operation" <<'REMOTE'
          main() {
            cd ~/windmill
            bash products-cutover.sh "$PWD" "$1"
          }
          main "$1" < /dev/null
          REMOTE
