name: Web Deploy

# Static Vite build → rsync to the VPS, where the same Caddy that fronts the backend serves
# ~/windmill/web at $DOMAIN_APP. `npm run build` runs `node --test test/` first, so the web half of
# the ladder drift gate fires here. Promotion requires compatible live sync metadata; a PR never touches the VPS.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'packages/**'
      - 'backend/deploy/sync_compatibility.py'
      - 'backend/test/deploy/deploy_production_test.py'
      - '.claude/skills/verify/SKILL.md'
      - '.github/workflows/web.yml'
      - '!web/**/*.md'
      - 'web/emails/README.md'
  pull_request:
    paths:
      - 'web/**'
      - 'packages/**'
      - 'backend/deploy/sync_compatibility.py'
      - 'backend/test/deploy/deploy_production_test.py'
      - '.claude/skills/verify/SKILL.md'
      - '.github/workflows/web.yml'
      - '!web/**/*.md'
      - 'web/emails/README.md'
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

defaults:
  run:
    working-directory: web

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Verify web sync deployment guard
        run: python3 ../backend/test/deploy/deploy_production_test.py WebCompatibilityTest -v

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Cache self-hosted embedding model
        uses: actions/cache@v5
        with:
          path: web/public/models
          key: models-${{ hashFiles('web/scripts/fetch-model.mjs') }}

      # Single origin: no API host is baked in — apiBase.js resolves the backend as same-origin.
      # Set VITE_API_BASE_URL only for a preview build that must reach a remote backend.
      - name: Build
        env:
          # It ships inside the client bundle: build config, not a secret.
          VITE_SENTRY_DSN: https://8ccb99ec79873a1f7ad27fb1939906d0@o4511760691953664.ingest.de.sentry.io/4511760715350096
          # Stamps the build so Sentry groups errors by release.
          VITE_RELEASE: ${{ github.sha }}
          # Paddle's client-side token is public (it only opens checkouts); the API key stays on the
          # server. Unset ⇒ empty token ⇒ paddleReady() is false and no surface offers a checkout.
          VITE_PADDLE_TOKEN: ${{ vars.PADDLE_TOKEN }}
          VITE_PADDLE_ENV: ${{ vars.PADDLE_ENV }}
        run: npm run build

      - name: Prepare pinned web release
        run: |
          python3 ../backend/deploy/sync_compatibility.py metadata ../packages/api-contract/sync web-sync-compatibility.json
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          dist = Path("dist")
          if dist.is_symlink():
              raise SystemExit("FAIL web release contains a symlink")
          paths = sorted(dist.rglob("*"))
          if any(path.is_symlink() for path in paths):
              raise SystemExit("FAIL web release contains a symlink")
          files = []
          for path in paths:
              if not path.is_file():
                  continue
              digest = hashlib.sha256()
              with path.open("rb") as contents:
                  for chunk in iter(lambda: contents.read(1024 * 1024), b""):
                      digest.update(chunk)
              files.append({"path": path.relative_to(dist).as_posix(), "bytes": path.stat().st_size,
                            "sha256": digest.hexdigest()})
          if not files:
              raise SystemExit("FAIL web release has no files")
          Path("web-release.json").write_text(json.dumps({
              "source": os.environ["GITHUB_SHA"],
              "compatibility": json.loads(Path("web-sync-compatibility.json").read_text()),
              "files": files}, indent=2) + "\n")
          PY

      - name: Retain pinned web release
        uses: actions/upload-artifact@v4
        with:
          name: web-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/dist/
            web/web-release.json
            web/web-sync-compatibility.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Rsync dist to the VPS
        if: github.event_name != 'pull_request'
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          printf '%s\n' "$SSH_KEY" > deploy_key
          chmod 600 deploy_key
          SSH="ssh -i deploy_key -p ${SSH_PORT:-22} -o StrictHostKeyChecking=accept-new"
          client=$(python3 -c 'import json, sys; sys.path.insert(0, "../backend/deploy"); from sync_compatibility import compatibility; value = compatibility(json.load(open("web-sync-compatibility.json"))); print(value["schema"], value["minSchema"])')
          $SSH "$SSH_USER@$SSH_HOST" "cd ~/windmill && python3 - web-preflight $client" < ../backend/deploy/sync_compatibility.py
          $SSH "$SSH_USER@$SSH_HOST" 'mkdir -p ~/windmill/web'
          rsync -az --delete -e "$SSH" dist/ "$SSH_USER@$SSH_HOST:windmill/web/"
