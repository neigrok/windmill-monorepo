name: Web Deploy

# Static Vite build → rsync to the VPS, where the same Caddy that fronts the backend serves
# ~/windmill/web at $DOMAIN_APP. `npm run build` runs the domain type check and then the test suite, so the web half
# of the ladder drift gate fires here. Promotion requires compatible live sync metadata; a PR never touches the VPS.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'packages/**'
      - 'backend/deploy/sync_compatibility.py'
      - 'backend/test/deploy/deploy_production_test.py'
      - 'backend/db/schema.sql'
      - 'backend/platform/adapters/http/ReplyWait.h'
      - 'backend/products/journal/adapters/http/VoiceApi.h'
      - 'backend/products/roadmap/adapters/ws/TreeSocket.h'
      - '.claude/skills/verify/SKILL.md'
      - '.github/workflows/web.yml'
      - '.github/actions/browser-system-libraries/**'
      - '!web/**/*.md'
      - 'web/emails/README.md'
  pull_request:
    paths:
      - 'web/**'
      - 'packages/**'
      - 'backend/deploy/sync_compatibility.py'
      - 'backend/test/deploy/deploy_production_test.py'
      - 'backend/db/schema.sql'
      - 'backend/platform/adapters/http/ReplyWait.h'
      - 'backend/products/journal/adapters/http/VoiceApi.h'
      - 'backend/products/roadmap/adapters/ws/TreeSocket.h'
      - '.claude/skills/verify/SKILL.md'
      - '.github/workflows/web.yml'
      - '.github/actions/browser-system-libraries/**'
      - '!web/**/*.md'
      - 'web/emails/README.md'
  workflow_dispatch:

# Only a run that can reach the VPS takes the deploy lock: a waiting run in a group is cancelled by
# the next one to wait, so a pull request sharing it would hold a deploy back or cancel it.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('web-pr-{0}', github.ref) || 'deploy-vps' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: web

jobs:
  # A pull request's suite again with roadmap's room reading the device's copy, as production's build reads it, so a
  # change that breaks the room on fails before it merges. It runs the domain type check and the tests, not the build: a
  # pull request's build below reaches no host, builds the room off and ships nothing.
  room-on-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Type-check the domain
        run: npm run check:domain

      - name: Install the browsers' system libraries
        uses: ./.github/actions/browser-system-libraries

      - name: Test with roadmap's room on
        env:
          VITE_ROADMAP_REPLICA_ROOM: on
        run: npm test

  build-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Verify web sync deployment guard
        run: python3 ../backend/test/deploy/deploy_production_test.py WebCompatibilityTest -v

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Cache self-hosted embedding model
        uses: actions/cache@v5
        with:
          path: web/public/models
          key: models-${{ hashFiles('web/scripts/fetch-model.mjs') }}

      - name: Install the browsers' system libraries
        uses: ./.github/actions/browser-system-libraries

      # The roadmap room reads the device's copy only where the server serves roadmap's scopes, so a build that can
      # reach the host takes the room from the running server (backend/deploy/README.md, "Roadmap's cutover onto the sync
      # engine"); the preflight below holds a release whose room the running server's is not. A pull request's build
      # reaches no host and builds the room off, and room-on-tests runs its suite with the room on.
      - name: Read roadmap's switch on the host
        id: roadmap
        if: github.event_name != 'pull_request'
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SSH_KEY" > "$key"
          chmod 600 "$key"
          room=$(ssh -i "$key" -p "${SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" \
            'cd ~/windmill && docker compose exec -T server sh -c "if grep -Fzxq ROADMAP_ENGINE_ENABLED=1 /proc/1/environ; then echo on; else echo off; fi"' \
            < /dev/null 2> /dev/null || true)
          if [ "$room" != on ] && [ "$room" != off ]; then
            echo "FAIL the running server's roadmap switch could not be read" >&2
            exit 1
          fi
          echo "Roadmap's room: $room"
          echo "room=$room" >> "$GITHUB_OUTPUT"

      # Single origin: no API host is baked in — apiBase.js resolves the backend as same-origin.
      # Set VITE_API_BASE_URL only for a preview build that must reach a remote backend.
      - name: Build
        env:
          # It ships inside the client bundle: build config, not a secret.
          VITE_SENTRY_DSN: https://8ccb99ec79873a1f7ad27fb1939906d0@o4511760691953664.ingest.de.sentry.io/4511760715350096
          # Stamps the build so Sentry groups errors by release.
          VITE_RELEASE: ${{ github.sha }}
          # The iPhone app's team, which the association file names (scripts/appSiteAssociation.js); a build given none writes no file.
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VITE_ROADMAP_REPLICA_ROOM: ${{ steps.roadmap.outputs.room || 'off' }}
        run: npm run build

      - name: Prepare pinned web release
        run: |
          python3 ../backend/deploy/sync_compatibility.py metadata ../packages/api-contract/sync web-sync-compatibility.json
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          dist = Path("dist")
          if dist.is_symlink():
              raise SystemExit("FAIL web release contains a symlink")
          paths = sorted(dist.rglob("*"))
          if any(path.is_symlink() for path in paths):
              raise SystemExit("FAIL web release contains a symlink")
          files = []
          for path in paths:
              if not path.is_file():
                  continue
              digest = hashlib.sha256()
              with path.open("rb") as contents:
                  for chunk in iter(lambda: contents.read(1024 * 1024), b""):
                      digest.update(chunk)
              files.append({"path": path.relative_to(dist).as_posix(), "bytes": path.stat().st_size,
                            "sha256": digest.hexdigest()})
          if not files:
              raise SystemExit("FAIL web release has no files")
          Path("web-release.json").write_text(json.dumps({
              "source": os.environ["GITHUB_SHA"],
              "compatibility": json.loads(Path("web-sync-compatibility.json").read_text()),
              "files": files}, indent=2) + "\n")
          PY

      - name: Retain pinned web release
        uses: actions/upload-artifact@v4
        with:
          name: web-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/dist/
            web/web-release.json
            web/web-sync-compatibility.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Prepare IndexNow site verification
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          if [[ -z "$INDEXNOW_KEY" ]]; then
            exit 0
          fi
          if ! [[ "$INDEXNOW_KEY" =~ ^[0-9a-f]{32}$ ]]; then
            echo 'INDEXNOW_KEY must contain 32 lowercase hexadecimal characters' >&2
            exit 1
          fi
          mkdir "$RUNNER_TEMP/indexnow-proof"
          printf '%s' "$INDEXNOW_KEY" > "$RUNNER_TEMP/indexnow-proof/$INDEXNOW_KEY.txt"

      - name: Rsync dist to the VPS
        if: github.event_name != 'pull_request'
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          ROADMAP_ROOM: ${{ steps.roadmap.outputs.room }}
        run: |
          set -euo pipefail
          # A site without the association file opens a roadmap's link in the browser, never the iPhone app, and reports nothing.
          if [[ ! -f dist/.well-known/apple-app-site-association ]]; then
            echo 'HOLD web deployment: the release holds no association file, which the build writes from APPLE_TEAM_ID' >&2
            exit 1
          fi
          printf '%s\n' "$SSH_KEY" > deploy_key
          chmod 600 deploy_key
          SSH="ssh -i deploy_key -p ${SSH_PORT:-22} -o StrictHostKeyChecking=accept-new"
          client=$(python3 -c 'import json, sys; sys.path.insert(0, "../backend/deploy"); from sync_compatibility import compatibility; value = compatibility(json.load(open("web-sync-compatibility.json"))); print(value["schema"], value["minSchema"])')
          $SSH "$SSH_USER@$SSH_HOST" "cd ~/windmill && python3 - web-preflight $client $ROADMAP_ROOM" < ../backend/deploy/sync_compatibility.py
          $SSH "$SSH_USER@$SSH_HOST" 'mkdir -p ~/windmill/web'
          release=(dist/)
          if [[ -n "${RUNNER_TEMP:-}" && -d "$RUNNER_TEMP/indexnow-proof" ]]; then
            release+=("$RUNNER_TEMP/indexnow-proof/")
          elif [[ "${GITHUB_REF:-}" != refs/heads/main ]]; then
            # A manual deploy from another ref has no key and must preserve the active proof.
            proof_pattern=$(printf '[0-9a-f]%.0s' {1..32})
            release=("--filter=P /$proof_pattern.txt" dist/)
          fi
          rsync -az --delete -e "$SSH" "${release[@]}" "$SSH_USER@$SSH_HOST:windmill/web/" \
            2>&1 | sed -E 's/[0-9a-f]{32}\.txt/[IndexNow proof]/g' >&2
