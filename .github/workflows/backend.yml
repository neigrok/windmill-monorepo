name: Backend CI/CD

# Monorepo: the C++ backend lives under backend/. Path-filtered so a web-only change
# never rebuilds the image. Build context is backend/ — the Dockerfile COPYs from there.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

concurrency:
  group: backend-cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  # Image name follows the monorepo repository. The deploy compose (backend/deploy/) must
  # reference this same name — reconcile both if the repo is renamed.
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Build the builder stage only — it compiles everything and runs ctest, so a red
  # suite fails here. Runs on every push and PR; shares the buildx layer cache with the
  # image build below, so main doesn't recompile from scratch.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build + test (builder stage)
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: build
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Build the slim runtime image and publish it to GHCR, tagged by commit SHA (+ latest).
  build-and-push:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          target: runtime
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
