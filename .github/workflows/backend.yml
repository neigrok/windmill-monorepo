name: Backend CI/CD

# services/embedder ships from here as a second image under the SAME package, tagged
# `embedder-<sha>`: one package means one visibility setting, and the host pulls with no login.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'services/embedder/**'
      - 'packages/api-contract/sync/*.registry.json'
      - 'packages/api-contract/sync/composition.json'
      - 'packages/api-contract/sync/corpus/**'
      - 'packages/api-contract/gym/catalog.json'
      - 'packages/api-contract/gym/abilities/**'
      - 'packages/api-contract/sync/reference/core/**'
      - '.github/workflows/backend.yml'
      - '.github/workflows/deploy.yml'
      - '!backend/**/*.md'
      - '!services/embedder/**/*.md'
  # The restore proof drives the web sync engine, so a pull request that changes it runs here too.
  pull_request:
    paths:
      - 'backend/**'
      - 'services/embedder/**'
      - 'packages/api-contract/sync/*.registry.json'
      - 'packages/api-contract/sync/composition.json'
      - 'packages/api-contract/sync/corpus/**'
      - 'packages/api-contract/gym/catalog.json'
      - 'packages/api-contract/gym/abilities/**'
      - 'packages/api-contract/sync/reference/core/**'
      - 'packages/api-contract/sync/reference/client/**'
      - 'web/src/platform/sync/**'
      - '.github/workflows/backend.yml'
      - '.github/workflows/deploy.yml'
      - '!backend/**/*.md'
      - '!services/embedder/**/*.md'
  workflow_dispatch:
    inputs:
      verify_live_coach:
        description: Run four paid-provider Coach checks on disposable data; do not publish images
        type: boolean
        default: false
      verify_live_anonymous_coach:
        description: Run three paid-provider anonymous Coach checks on disposable installations; do not publish images
        type: boolean
        default: false

concurrency:
  group: backend-cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  # The deploy compose (backend/deploy/) must reference this same image name.
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # The builder stage compiles everything and runs ctest, so a red suite fails here. Its Drogon layer, the pinned
  # release with the patches in backend/third_party/drogon, comes out of this cache until the pin or a patch changes.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify deployment workflow and image context
        run: python3 backend/test/deploy/deploy_production_test.py DeployWorkflowTest -v
      - uses: docker/setup-buildx-action@v4
      - name: Build + test (builder stage)
        uses: docker/build-push-action@v7
        with:
          context: backend
          build-contexts: contract=packages/api-contract
          target: build
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The builder stage the test job built and cached, run again against a Postgres service: the domain, mcp,
  # sync and adapters suites with their WM_PG_TEST cases, the domain suite's pattern fuzz over cases
  # the JS reference generated and answered for a fresh seed, and what engine.md asks of a deployment (§9.1's
  # credential cases and §6.8's idle live socket) against windmill_server_probe and windmill_server, through the
  # production Caddyfile over HTTP/1.1 and HTTP/2. On the runner itself: re-applying schema.sql, as every deploy does,
  # changes nothing.
  postgres:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: windmill_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/windmill_test
      WM_SYNC_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/windmill_sync_test
      WM_DEPLOYMENT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/windmill_deployment_test
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Load the tested builder stage
        uses: docker/build-push-action@v7
        with:
          context: backend
          build-contexts: contract=packages/api-contract
          target: build
          load: true
          tags: windmill-backend-build
          cache-from: type=gha
      - name: Prepare isolated REST, sync and deployment databases
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/db/schema.sql
          createdb --maintenance-db="$DATABASE_URL" windmill_sync_test
          psql "$WM_SYNC_DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/db/schema.sql -f backend/db/probe.sql
          createdb --maintenance-db="$DATABASE_URL" windmill_deployment_test
          psql "$WM_DEPLOYMENT_DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/db/schema.sql
      - name: Re-applying schema.sql, as every deploy does, changes nothing
        run: python3 backend/test/deploy/schema_reapplication_test.py --maintenance-db "$DATABASE_URL"
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Generate pattern cases from the JS reference
        run: node backend/test/platform/domain/sync/reference_pattern_cases.mjs > "$RUNNER_TEMP/pattern-cases.json"
      - name: Run the domain, mcp, sync, adapters and epoch tool suites against Postgres
        run: |
          docker run --rm --network host -e WM_PG_TEST=1 -e DATABASE_URL -e WM_SYNC_DATABASE_URL \
            -e WM_PATTERN_CASES=/cases/pattern-cases.json -v "$RUNNER_TEMP:/cases:ro" \
            windmill-backend-build ctest --test-dir build -R '^(domain|sync|adapters|mcp|sync_epoch)$' --output-on-failure
      - name: Prove client recovery after restoring an older dump
        run: |
          sudo apt-get update
          sudo apt-get install -y libjsoncpp25 libc-ares2 libpq5 libbrotli1 libcurl4 postgresql-client-16
          npm ci --prefix web --ignore-scripts --no-audit --no-fund
          docker create --name epoch-proof-binaries windmill-backend-build
          trap 'docker rm -f epoch-proof-binaries' EXIT
          docker cp epoch-proof-binaries:/src/build/windmill_server "$RUNNER_TEMP/windmill_server"
          docker cp epoch-proof-binaries:/src/build/windmill_server_test_clock "$RUNNER_TEMP/windmill_server_test_clock"
          docker cp epoch-proof-binaries:/src/build/windmill_rotate_sync_epoch "$RUNNER_TEMP/windmill_rotate_sync_epoch"
          PATH="/usr/lib/postgresql/16/bin:$PATH" node backend/test/e2e/sync_epoch_restore.mjs --maintenance-db "$DATABASE_URL" \
            --server-bin "$RUNNER_TEMP/windmill_server" --clock-server-bin "$RUNNER_TEMP/windmill_server_test_clock" \
            --rotate-bin "$RUNNER_TEMP/windmill_rotate_sync_epoch"
      - name: Serve windmill_server_probe from the tested builder stage
        run: |
          docker run -d --name probe --network host -e DATABASE_URL="$WM_SYNC_DATABASE_URL" -e PORT=18613 windmill-backend-build build/windmill_server_probe
          for ((attempt=0; attempt<50; attempt++)); do
            curl -sf -o /dev/null -H 'Sync-Schema: 2' http://127.0.0.1:18613/v1/sync/hello && exit 0
            sleep 0.2
          done
          docker logs probe
          exit 1
      - name: Probe credentials and the idle live socket, directly and through the production edge (engine.md §9.1, §6.8)
        run: WM_E2E_DB="$WM_SYNC_DATABASE_URL" PORT=18613 EDGE_PORT=18643 node backend/test/e2e/deployment_conformance.mjs
      - name: deploy.yml forwards the native-auth settings (it reads the repo, so it runs outside the image)
        run: python3 backend/test/e2e/deploy_auth_env_test.py
      - name: Serve windmill_server from the tested builder stage
        run: |
          docker run -d --name server --network host -e DATABASE_URL="$WM_DEPLOYMENT_DATABASE_URL" \
            -e PORT=18614 windmill-backend-build build/windmill_server
          for ((attempt=0; attempt<50; attempt++)); do
            curl -sf -o /dev/null -H 'Sync-Schema: 4' http://127.0.0.1:18614/v1/sync/hello && exit 0
            sleep 0.2
          done
          docker logs server
          exit 1
      - name: Composed catalog credentials and the idle live socket, directly and through the production edge (engine.md §9.1, §6.8)
        run: WM_E2E_DB="$WM_DEPLOYMENT_DATABASE_URL" WM_E2E_CATALOG=products PORT=18614 EDGE_PORT=18644 node backend/test/e2e/deployment_conformance.mjs
      - name: Stop deployment servers and drop throwaway databases
        if: always()
        run: |
          docker rm -f probe server || true
          dropdb --if-exists --maintenance-db="$DATABASE_URL" windmill_deployment_test
          dropdb --if-exists --maintenance-db="$DATABASE_URL" windmill_sync_test

  live-coach:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_live_coach && !inputs.verify_live_anonymous_coach
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coach_live
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/coach_live
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Load this commit's tested server
        uses: docker/build-push-action@v7
        with:
          context: backend
          build-contexts: contract=packages/api-contract
          target: build
          load: true
          tags: windmill-coach-live
          cache-from: type=gha
      - name: Prepare disposable accounts and local telemetry
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/db/schema.sql
          python3 backend/test/e2e/coach_live.py prepare --evidence "$RUNNER_TEMP/coach-live"
          docker run -d --name coach-live-observer --network host \
            -v "$RUNNER_TEMP/coach-live:/evidence" \
            windmill-coach-live python3 test/e2e/coach_live.py observe --evidence /evidence
      - name: Verify real Coach and photo interpretation with USD accounting
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          test -n "$ANTHROPIC_API_KEY"
          docker run -d --name coach-live-server --network host \
            --add-host api.resend.com:127.0.0.1 -v "$RUNNER_TEMP/coach-live:/evidence" \
            -e ANTHROPIC_API_KEY -e DATABASE_URL -e PORT=8088 -e WINDMILL_HOST=127.0.0.1 \
            -e WINDMILL_APP_URL=http://127.0.0.1:8088 -e COACH_MAX_OUTPUT_TOKENS=2000 \
            -e AI_ALLOWANCES_ENABLED=true -e WINDMILL_OWNER_EMAILS=coach-live-owner@example.com \
            -e AI_ALLOWANCE_ALERT_EMAIL=coach-live-owner@example.com -e RESEND_API_KEY=local-mail-fixture \
            -e 'RESEND_FROM=Windmill <local@example.com>' -e SSL_CERT_FILE=/evidence/ca-bundle.pem \
            -e SENTRY_DSN=https://local@localhost:9443/1 -e SENTRY_ENVIRONMENT=live-verification \
            -e AMPLITUDE_API_KEY=local-telemetry-fixture -e AMPLITUDE_HOST=localhost:9443 \
            windmill-coach-live build/windmill_server
          for ((attempt=0; attempt<50; attempt++)); do
            if curl -sf -o /dev/null -H 'Sync-Schema: 6' http://127.0.0.1:8088/v1/sync/hello; then
              python3 backend/test/e2e/coach_live.py verify --evidence "$RUNNER_TEMP/coach-live"
              exit $?
            fi
            sleep 0.2
          done
          echo 'The isolated Coach server did not start.'
          exit 1
      - name: Retain bounded verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coach-live-results
          path: ${{ runner.temp }}/coach-live/results.json
          if-no-files-found: warn
          retention-days: 7
      - name: Remove isolated server and private evidence
        if: always()
        run: |
          docker rm -f coach-live-server coach-live-observer || true
          sudo rm -rf "$RUNNER_TEMP/coach-live"

  live-anonymous-coach:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_live_anonymous_coach && !inputs.verify_live_coach
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: anonymous_coach_live
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/anonymous_coach_live
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Load this commit's tested server
        uses: docker/build-push-action@v7
        with:
          context: backend
          build-contexts: contract=packages/api-contract
          target: build
          load: true
          tags: windmill-anonymous-coach-live
          cache-from: type=gha
      - name: Prepare isolated accounts and telemetry
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/db/schema.sql
          python3 backend/test/e2e/anonymous_coach.py prepare --evidence "$RUNNER_TEMP/anonymous-coach-live"
          docker run -d --name anonymous-coach-observer --network host \
            -v "$RUNNER_TEMP/anonymous-coach-live:/evidence" \
            windmill-anonymous-coach-live python3 test/e2e/anonymous_coach.py observe --evidence /evidence
      - name: Verify anonymous goal, program and photo with actual provider costs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          test -n "$ANTHROPIC_API_KEY"
          export AI_INSTALLATION_IP_HMAC_KEY="$(cat "$RUNNER_TEMP/anonymous-coach-live/installation-key")"
          docker run -d --name anonymous-coach-server --network host \
            --add-host api.resend.com:127.0.0.1 -v "$RUNNER_TEMP/anonymous-coach-live:/evidence" \
            -e ANTHROPIC_API_KEY -e DATABASE_URL -e PORT=8088 -e WINDMILL_HOST=127.0.0.1 \
            -e WINDMILL_APP_URL=http://127.0.0.1:8088 \
            -e AI_ALLOWANCES_ENABLED=true -e AI_INSTALLATIONS_ENABLED=true \
            -e AI_INSTALLATION_IP_HMAC_KEY -e AI_INSTALLATION_PROXY_MODE=direct \
            -e WINDMILL_OWNER_EMAILS=coach-live-owner@example.com \
            -e AI_ALLOWANCE_ALERT_EMAIL=coach-live-owner@example.com -e RESEND_API_KEY=local-mail-fixture \
            -e 'RESEND_FROM=Windmill <local@example.com>' -e SSL_CERT_FILE=/evidence/ca-bundle.pem \
            -e SENTRY_DSN=https://local@localhost:9443/1 -e SENTRY_ENVIRONMENT=anonymous-live-verification \
            -e AMPLITUDE_API_KEY=local-telemetry-fixture -e AMPLITUDE_HOST=localhost:9443 \
            windmill-anonymous-coach-live build/windmill_server
          for ((attempt=0; attempt<50; attempt++)); do
            if curl -sf -o /dev/null -H 'Sync-Schema: 6' http://127.0.0.1:8088/v1/sync/hello; then
              python3 backend/test/e2e/anonymous_coach.py verify --provider anthropic --evidence "$RUNNER_TEMP/anonymous-coach-live"
              exit $?
            fi
            sleep 0.2
          done
          echo 'The isolated anonymous Coach server did not start.'
          exit 1
      - name: Retain bounded verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anonymous-coach-live-results
          path: ${{ runner.temp }}/anonymous-coach-live/results.json
          if-no-files-found: warn
          retention-days: 7
      - name: Remove isolated server and private evidence
        if: always()
        run: |
          docker rm -f anonymous-coach-server anonymous-coach-observer || true
          sudo rm -rf "$RUNNER_TEMP/anonymous-coach-live"

  build-and-push:
    needs: [test, postgres]
    if: github.event_name != 'pull_request' && !inputs.verify_live_coach && !inputs.verify_live_anonymous_coach
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: backend
          build-contexts: contract=packages/api-contract
          target: runtime
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The model is not in this image: the compose file mounts the deployed web root's weights.
      - uses: docker/build-push-action@v7
        with:
          context: services/embedder
          push: true
          tags: |
            ${{ env.IMAGE }}:embedder-${{ github.sha }}
            ${{ env.IMAGE }}:embedder-latest
          cache-from: type=gha,scope=embedder
          cache-to: type=gha,mode=max,scope=embedder
