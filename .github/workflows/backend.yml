name: Backend CI/CD

# services/embedder ships from here as a second image under the SAME package, tagged
# `embedder-<sha>`: one package means one visibility setting, and the host pulls with no login.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'services/embedder/**'
      - 'packages/api-contract/sync/*.registry.json'
      - 'packages/api-contract/sync/corpus/**'
      - 'packages/api-contract/sync/reference/core/**'
      - '.github/workflows/backend.yml'
      - '!backend/**/*.md'
      - '!services/embedder/**/*.md'
  pull_request:
    paths:
      - 'backend/**'
      - 'services/embedder/**'
      - 'packages/api-contract/sync/*.registry.json'
      - 'packages/api-contract/sync/corpus/**'
      - 'packages/api-contract/sync/reference/core/**'
      - '.github/workflows/backend.yml'
      - '!backend/**/*.md'
      - '!services/embedder/**/*.md'
  workflow_dispatch:

concurrency:
  group: backend-cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  # The deploy compose (backend/deploy/) must reference this same image name.
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # The builder stage compiles everything and runs ctest, so a red suite fails here.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build + test (builder stage)
        uses: docker/build-push-action@v7
        with:
          context: backend
          build-contexts: contract=packages/api-contract
          target: build
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The builder stage the test job built and cached, run again against a Postgres service: the domain,
  # sync and adapters suites with their WM_PG_TEST cases, and the domain suite's pattern fuzz over cases
  # the JS reference generated and answered for a fresh seed.
  postgres:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: windmill_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/windmill_test
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Load the tested builder stage
        uses: docker/build-push-action@v7
        with:
          context: backend
          build-contexts: contract=packages/api-contract
          target: build
          load: true
          tags: windmill-backend-build
          cache-from: type=gha
      - name: Apply the schema and the probe's tables
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/db/schema.sql -f backend/db/probe.sql
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Generate pattern cases from the JS reference
        run: node backend/test/platform/domain/sync/reference_pattern_cases.mjs > "$RUNNER_TEMP/pattern-cases.json"
      - name: Run the domain, sync and adapters suites against Postgres
        run: |
          docker run --rm --network host -e WM_PG_TEST=1 -e DATABASE_URL \
            -e WM_PATTERN_CASES=/cases/pattern-cases.json -v "$RUNNER_TEMP:/cases:ro" \
            windmill-backend-build ctest --test-dir build -R '^(domain|sync|adapters)$' --output-on-failure

  build-and-push:
    needs: [test, postgres]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: backend
          build-contexts: contract=packages/api-contract
          target: runtime
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The model is not in this image: the compose file mounts the deployed web root's weights.
      - uses: docker/build-push-action@v7
        with:
          context: services/embedder
          push: true
          tags: |
            ${{ env.IMAGE }}:embedder-${{ github.sha }}
            ${{ env.IMAGE }}:embedder-latest
          cache-from: type=gha,scope=embedder
          cache-to: type=gha,mode=max,scope=embedder
