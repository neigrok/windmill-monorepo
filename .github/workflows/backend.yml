name: Backend CI/CD

# services/embedder ships from here as a second image under the SAME package, tagged
# `embedder-<sha>`: one package means one visibility setting, and the host pulls with no login.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'services/embedder/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'services/embedder/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:
    inputs:
      verify_coach_provider:
        description: 'Verify Coach against Anthropic with disposable runner data; publish nothing'
        type: boolean
        default: false

concurrency:
  group: backend-cicd-${{ github.ref }}-${{ inputs.verify_coach_provider && 'coach-verification' || 'build' }}
  cancel-in-progress: true

env:
  # The deploy compose (backend/deploy/) must reference this same image name.
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # The builder stage compiles everything and runs ctest, so a red suite fails here.
  test:
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILD_RECORD_UPLOAD: ${{ inputs.verify_coach_provider && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@v5
      - name: Test isolated Coach verification bootstrap
        run: python3 -m unittest discover -s backend/test/e2e -p 'test_coach_provider_*.py' -v
      - uses: docker/setup-buildx-action@v4
      - name: Build + test (builder stage)
        uses: docker/build-push-action@v7
        with:
          context: backend
          target: build
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push:
    needs: test
    if: github.event_name != 'pull_request' && !(github.event_name == 'workflow_dispatch' && inputs.verify_coach_provider)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: backend
          target: runtime
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The model is not in this image: the compose file mounts the deployed web root's weights.
      - uses: docker/build-push-action@v7
        with:
          context: services/embedder
          push: true
          tags: |
            ${{ env.IMAGE }}:embedder-${{ github.sha }}
            ${{ env.IMAGE }}:embedder-latest
          cache-from: type=gha,scope=embedder
          cache-to: type=gha,mode=max,scope=embedder

  verify-coach-provider:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.verify_coach_provider
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build the unpublished candidate runtime
        uses: docker/build-push-action@v7
        with:
          context: backend
          target: runtime
          push: false
          load: true
          tags: windmill-coach-verify:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
      - name: Verify Coach with disposable runner data
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COACH_VERIFY_PROVIDER: ${{ inputs.verify_coach_provider }}
        run: python3 backend/test/e2e/coach_provider_ci.py
      - name: Upload sanitized Coach acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coach-provider-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/coach-provider-evidence/coach-provider-run.json
            ${{ runner.temp }}/coach-provider-evidence/coach-provider-acceptance.json
          if-no-files-found: warn
          retention-days: 14
