name: Backend CI/CD

# services/embedder ships from here as a second image under the SAME package, tagged
# `embedder-<sha>`: one package means one visibility setting, and the host pulls with no login.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'services/embedder/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'services/embedder/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

concurrency:
  group: backend-cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  # The deploy compose (backend/deploy/) must reference this same image name.
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # The builder stage compiles everything and runs ctest, so a red suite fails here.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build + test (builder stage)
        uses: docker/build-push-action@v7
        with:
          context: backend
          target: build
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: backend
          target: runtime
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The model is not in this image: the compose file mounts the deployed web root's weights.
      - uses: docker/build-push-action@v7
        with:
          context: services/embedder
          push: true
          tags: |
            ${{ env.IMAGE }}:embedder-${{ github.sha }}
            ${{ env.IMAGE }}:embedder-latest
          cache-from: type=gha,scope=embedder
          cache-to: type=gha,mode=max,scope=embedder
