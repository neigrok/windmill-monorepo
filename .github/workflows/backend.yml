name: Backend CI/CD

# services/embedder ships from here as a second image under the SAME package, tagged
# `embedder-<sha>`: one package means one visibility setting, and the host pulls with no login.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'services/embedder/**'
      - 'packages/api-contract/sync/*.registry.json'
      - 'packages/api-contract/sync/composition.json'
      - 'packages/api-contract/sync/corpus/**'
      - 'packages/api-contract/sync/reference/core/**'
      - '.github/workflows/backend.yml'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/products-cutover.yml'
      - '!backend/**/*.md'
      - '!services/embedder/**/*.md'
  pull_request:
    paths:
      - 'backend/**'
      - 'services/embedder/**'
      - 'packages/api-contract/sync/*.registry.json'
      - 'packages/api-contract/sync/composition.json'
      - 'packages/api-contract/sync/corpus/**'
      - 'packages/api-contract/sync/reference/core/**'
      - '.github/workflows/backend.yml'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/products-cutover.yml'
      - '!backend/**/*.md'
      - '!services/embedder/**/*.md'
  workflow_dispatch:

concurrency:
  group: backend-cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  # The deploy compose (backend/deploy/) must reference this same image name.
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # The builder stage compiles everything and runs ctest, so a red suite fails here. Its Drogon layer, the pinned
  # release with the patches in backend/third_party/drogon, comes out of this cache until the pin or a patch changes.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build + test (builder stage)
        uses: docker/build-push-action@v7
        with:
          context: backend
          build-contexts: contract=packages/api-contract
          target: build
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The builder stage the test job built and cached, run again against a Postgres service: the domain,
  # sync and adapters suites with their WM_PG_TEST cases, the domain suite's pattern fuzz over cases
  # the JS reference generated and answered for a fresh seed, and what engine.md asks of a deployment (§9.1's
  # credential cases and §6.8's idle live socket) against windmill_server_probe and SYNC_ENABLED=1 windmill_server, through the
  # production Caddyfile over HTTP/1.1 and HTTP/2.
  postgres:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: windmill_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      # The builder's PG14 pg_dump reads both catalog snapshots and real rollback archives.
      migration-postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: products_migration_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/windmill_test
      WM_SYNC_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/windmill_sync_test
      WM_ENGINE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/windmill_deployment_test
      WM_MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/products_migration_test
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - name: Load the tested builder stage
        uses: docker/build-push-action@v7
        with:
          context: backend
          build-contexts: contract=packages/api-contract
          target: build
          load: true
          tags: windmill-backend-build
          cache-from: type=gha
      - name: Prepare isolated REST, sync and deployment databases
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/db/schema.sql
          createdb --maintenance-db="$DATABASE_URL" windmill_sync_test
          psql "$WM_SYNC_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f backend/db/schema.sql -f backend/db/probe.sql -f backend/db/gym_sync.sql -f backend/db/journal_sync.sql -f backend/db/gym_sync_v5.sql
          createdb --maintenance-db="$DATABASE_URL" windmill_deployment_test
          psql "$WM_ENGINE_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f backend/db/schema.sql -f backend/db/gym_sync.sql -f backend/db/journal_sync.sql
      - name: Preserve fresh and adopted catalogs when deployment re-applies schema.sql
        run: |
          git show 4b18960d5d24855750a77f7904d8ea7b341a03b7:backend/db/schema.sql > "$RUNNER_TEMP/origin-schema.sql"
          docker run --rm --network host -e DATABASE_URL="$WM_MIGRATION_TEST_DATABASE_URL" \
            -v "$RUNNER_TEMP/origin-schema.sql:/origin-schema.sql:ro" windmill-backend-build \
            python3 test/deploy/schema_reapplication_test.py --bin-dir build \
            --origin-schema /origin-schema.sql --maintenance-db "$WM_MIGRATION_TEST_DATABASE_URL"
      - name: Exercise production cutover, rollback, killed-script recovery and deploy refusals
        run: |
          docker run --rm --network host -e DATABASE_URL="$WM_MIGRATION_TEST_DATABASE_URL" \
            -v "$GITHUB_WORKSPACE/.github/workflows/deploy.yml:/deploy.yml:ro" \
            -v "$GITHUB_WORKSPACE/.github/workflows/products-cutover.yml:/products-cutover.yml:ro" \
            windmill-backend-build python3 test/deploy/products_cutover_test.py --bin-dir build \
            --maintenance-db "$WM_MIGRATION_TEST_DATABASE_URL" --deploy-workflow /deploy.yml \
            --cutover-workflow /products-cutover.yml
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Generate pattern cases from the JS reference
        run: node backend/test/platform/domain/sync/reference_pattern_cases.mjs > "$RUNNER_TEMP/pattern-cases.json"
      - name: Run the domain, sync and adapters suites against Postgres
        run: |
          docker run --rm --network host -e WM_PG_TEST=1 -e DATABASE_URL -e WM_SYNC_DATABASE_URL \
            -e WM_PATTERN_CASES=/cases/pattern-cases.json -v "$RUNNER_TEMP:/cases:ro" \
            windmill-backend-build ctest --test-dir build -R '^(domain|sync|adapters)$' --output-on-failure
      - name: Serve windmill_server_probe from the tested builder stage
        run: |
          docker run -d --name probe --network host -e DATABASE_URL="$WM_SYNC_DATABASE_URL" -e PORT=18613 windmill-backend-build build/windmill_server_probe
          for ((attempt=0; attempt<50; attempt++)); do
            curl -sf -o /dev/null -H 'Sync-Schema: 2' http://127.0.0.1:18613/v1/sync/hello && exit 0
            sleep 0.2
          done
          docker logs probe
          exit 1
      - name: Probe credentials and the idle live socket, directly and through the production edge (engine.md §9.1, §6.8)
        run: WM_E2E_DB="$WM_SYNC_DATABASE_URL" PORT=18613 EDGE_PORT=18643 node backend/test/e2e/deployment_conformance.mjs
      - name: deploy.yml forwards the native-auth and sync settings (it reads the repo, so it runs outside the image)
        run: python3 backend/test/e2e/deploy_auth_env_test.py
      - name: Prove windmill_server has no sync routes with SYNC_ENABLED unset
        run: |
          docker run -d --name engine-sync-off --network host -e DATABASE_URL="$WM_ENGINE_DATABASE_URL" \
            -e PORT=18614 windmill-backend-build build/windmill_server
          ready=0
          for ((attempt=0; attempt<50; attempt++)); do
            if curl -s -o /dev/null http://127.0.0.1:18614/v1/sync/hello; then
              ready=1
              break
            fi
            sleep 0.2
          done
          if [ "$ready" != 1 ]; then
            docker logs engine-sync-off
            exit 1
          fi
          WM_E2E_CATALOG=products PORT=18614 node backend/test/e2e/deployment_conformance.mjs --check-disabled
          docker rm -f engine-sync-off
      - name: Adopt the composed catalog's deployment accounts
        run: |
          WM_E2E_DB="$WM_ENGINE_DATABASE_URL" WM_E2E_CATALOG=products node backend/test/e2e/deployment_conformance.mjs --prepare-accounts
          docker run --rm --network host -e DATABASE_URL="$WM_ENGINE_DATABASE_URL" \
            windmill-backend-build build/windmill_gym_backfill
          docker run --rm --network host -e DATABASE_URL="$WM_ENGINE_DATABASE_URL" \
            windmill-backend-build build/windmill_journal_backfill
      - name: Serve windmill_server with SYNC_ENABLED from the tested builder stage
        run: |
          docker run -d --name engine-sync --network host -e DATABASE_URL="$WM_ENGINE_DATABASE_URL" \
            -e PORT=18614 -e SYNC_ENABLED=1 windmill-backend-build build/windmill_server
          for ((attempt=0; attempt<50; attempt++)); do
            curl -sf -o /dev/null -H 'Sync-Schema: 4' http://127.0.0.1:18614/v1/sync/hello && exit 0
            sleep 0.2
          done
          docker logs engine-sync
          exit 1
      - name: Composed catalog credentials and the idle live socket, directly and through the production edge (engine.md §9.1, §6.8)
        run: WM_E2E_DB="$WM_ENGINE_DATABASE_URL" WM_E2E_CATALOG=products PORT=18614 EDGE_PORT=18644 node backend/test/e2e/deployment_conformance.mjs
      - name: Serve two windmill_server processes from the tested builder stage and compare gym writes
        run: >-
          python3 backend/test/e2e/gym_write_differential.py
          --mode off-vs-on
          --image windmill-backend-build --bin-dir build
          --maintenance-db "$DATABASE_URL"
      - name: Serve two windmill_server processes from the tested builder stage and compare journal writes
        run: >-
          python3 backend/test/e2e/journal_write_differential.py
          --image windmill-backend-build --bin-dir build
          --maintenance-db "$DATABASE_URL"
      - name: Stop deployment servers and drop throwaway databases
        if: always()
        run: |
          docker rm -f probe engine-sync engine-sync-off || true
          dropdb --if-exists --maintenance-db="$DATABASE_URL" windmill_deployment_test
          dropdb --if-exists --maintenance-db="$DATABASE_URL" windmill_sync_test

  build-and-push:
    needs: [test, postgres]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: backend
          build-contexts: contract=packages/api-contract
          target: runtime
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The model is not in this image: the compose file mounts the deployed web root's weights.
      - uses: docker/build-push-action@v7
        with:
          context: services/embedder
          push: true
          tags: |
            ${{ env.IMAGE }}:embedder-${{ github.sha }}
            ${{ env.IMAGE }}:embedder-latest
          cache-from: type=gha,scope=embedder
          cache-to: type=gha,mode=max,scope=embedder
