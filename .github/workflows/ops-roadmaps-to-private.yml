# By hand only, from main, never during a deploy: moves every unlisted roadmap of people's to private through the sync
# engine, a dry run unless `write` is set (backend/SPEC.md, Unlisted roadmaps to private). The tool runs inside the live
# server container, with the database that container already knows, and refuses a house account's roadmap. Its counts
# and its write lines are one person's private facts where few people hold roadmaps, and this repository's logs are
# public, so all it says is sealed on the runner to the owner's certificate, .github/ops/inventory-recipient.pem, before
# anything is printed. Opening it is in backend/deploy/README.md.
name: Ops · roadmaps to private

on:
  workflow_dispatch:
    inputs:
      write:
        description: Write the moves; unset, the tool counts what it would move and writes nothing
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  # A run waiting for the deploy-vps lock is cancelled by the next one to wait, so the move only queues for the lock
  # once no deploy holds it or waits for it.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github
          persist-credentials: false
      - name: Refuse unless from main and while no deploy runs or waits to run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo 'Refusing the move: it runs from main alone.' >&2
            exit 1
          fi
          # A deploy recreates the server container the tool runs in. A deploy is a run of a workflow whose concurrency
          # takes the deploy-vps lock, read from the workflows themselves; a pull request's run takes no lock and reaches
          # no server, so it is not one.
          deploys=$(awk '/^concurrency:/ { inside = 1; next } /^[^ ]/ { inside = 0 } inside && /deploy-vps/ { print FILENAME }' \
            .github/workflows/*.yml | sort -u)
          if ! printf '%s\n' "$deploys" | grep -qx '.github/workflows/deploy.yml'; then
            echo "Deploy to VPS no longer names the deploy-vps lock where this looks, so a deploy cannot be told apart: refusing to run." >&2
            exit 1
          fi
          for workflow in $deploys; do
            for status in queued in_progress waiting requested pending; do
              runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$(basename "$workflow")" --status "$status" \
                --json event --jq '[.[] | select(.event != "pull_request")] | length')
              if [ "$runs" -ne 0 ]; then
                echo "Not during a deploy: $(basename "$workflow") has a run $status. Dispatch the move again once it has finished." >&2
                exit 1
              fi
            done
          done

  move:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github
          persist-credentials: false
      - name: Move the unlisted roadmaps to private, everything the tool says sealed to the owner
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          WRITE: ${{ inputs.write }}
        run: |
          set -euo pipefail
          key=$(mktemp)
          sealed=$(mktemp)
          trap 'rm -f "$key" "$sealed"' EXIT
          printf '%s\n' "$SSH_KEY" > "$key"
          chmod 600 "$key"
          # The host's shell reads the script below from stdin; its arguments are the tool's.
          remote='bash -seuo pipefail --'
          if [ "$WRITE" = true ]; then remote="$remote --write"; fi
          # The tool's counts on stdout and its write lines on stderr, both on stdout here.
          move() {
            ssh -i "$key" -p "${SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" "$remote" <<'REMOTE'
          # The whole script is read before it runs, and nothing it starts can read the rest of it from stdin.
          main() {
            cd ~/windmill
            # 3 is the image without the tool; any other failure is Docker's own, which says why itself.
            carried=0
            docker compose exec -T server sh -c 'command -v windmill_roadmaps_to_private > /dev/null || exit 3' || carried=$?
            if [ "$carried" -eq 3 ]; then
              echo "The live server image does not carry windmill_roadmaps_to_private: deploy a commit that does, then run this again." >&2
              exit 1
            fi
            if [ "$carried" -ne 0 ]; then exit "$carried"; fi
            docker compose exec -T server windmill_roadmaps_to_private "$@" 2>&1
          }
          main "$@" < /dev/null
          REMOTE
          }
          # What the tool says goes from ssh straight into the seal, so no plaintext reaches a file or the log. The sealed
          # block is printed whether the tool finished or stopped, since what it wrote before a stop stays written.
          set +e
          move | openssl smime -encrypt -aes256 -binary -outform PEM -out "$sealed" .github/ops/inventory-recipient.pem
          statuses=("${PIPESTATUS[@]}")
          set -e
          if [ "${statuses[1]}" -ne 0 ]; then
            echo "The tool's output could not be sealed, so none is printed." >&2
            exit 1
          fi
          cat "$sealed"
          if [ "${statuses[0]}" -ne 0 ]; then
            echo "The move stopped with exit ${statuses[0]}; the sealed block says how far it went." >&2
            exit 1
          fi
