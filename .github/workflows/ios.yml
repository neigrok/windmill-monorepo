name: iOS CI

# Tests the Swift packages under apps/ios — the sync engine (Sync), the domain kit (Domain) and the engine's
# public-surface test (SyncTestingSurface) — and builds the dev-only SyncProbe app and the product app in Release for
# the simulator. App unit tests and three class-based UI shards (ios-ui-tests.yml) run in parallel; ships nothing. The corpus runners read
# packages/api-contract/{sync,domain-kit,gym,journal} by walking up from #filePath, and the
# SyncSchema target is generated from the registries there, so the whole repository is checked out and a
# change to any of those contracts runs this workflow too.

on:
  push:
    branches: [main]
    paths:
      - 'apps/ios/**'
      - 'packages/api-contract/sync/**'
      - 'packages/api-contract/domain-kit/**'
      - 'packages/api-contract/gym/**'
      - 'packages/api-contract/journal/**'
      - 'packages/api-contract/gym-ladder.json'
      - '.github/workflows/ios.yml'
      - '.github/workflows/ios-ui-tests.yml'
      - '.github/workflows/ios-nightly.yml'
      - '!apps/ios/**/*.md'
  pull_request:
    paths:
      - 'apps/ios/**'
      - 'packages/api-contract/sync/**'
      - 'packages/api-contract/domain-kit/**'
      - 'packages/api-contract/gym/**'
      - 'packages/api-contract/journal/**'
      - 'packages/api-contract/gym-ladder.json'
      - '.github/workflows/ios.yml'
      - '.github/workflows/ios-ui-tests.yml'
      - '.github/workflows/ios-nightly.yml'
      - '!apps/ios/**/*.md'
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # swift-tools-version 6.2 and swift-syntax 602 need this pinned compiler.
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  TZ: UTC

defaults:
  run:
    working-directory: apps/ios/Sync

jobs:
  packages-and-builds:
    runs-on: macos-26
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v5

      # One package checkout per app, laid out as apps/ios lays out the apps: the probe build, the domain kit's layering
      # test and the Release build resolve each app's packages once.
      - name: Share the apps' package checkouts
        run: echo "WM_SOURCE_PACKAGES=$RUNNER_TEMP/source-packages" >> "$GITHUB_ENV"

      # The repository pins one toolchain: the domain kit's layering tests read sources with swift-syntax
      # 602, which must match the compiler's major (Swift 6.2), and its compile attacks assert what that
      # compiler refuses. Moving to a newer Xcode means bumping swift-syntax and re-checking the attacks.
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - run: |
          xcodebuild -version
          swift --version

      # The probe app's project is generated from project.yml, and the domain kit's layering tests
      # resolve it and their app fixtures with XcodeGen.
      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install xcodegen
          xcodegen --version

      # Every UI class runs in exactly one shard, except the opt-in ones, which must keep their guard: the design
      # captures, and the nightly classes, which iOS nightly runs instead.
      - name: Check UI shard coverage
        run: |
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path
          import re

          tests = Path("../App/UITests")
          workflows = Path("../../../.github/workflows")
          classes = Counter(name for source in tests.rglob("*.swift")
                            for name in re.findall(r"\bclass\s+(\w+)\s*:\s*XCTestCase", source.read_text()))
          opt_in = {
              "DesignCapture": ("DesignCapture/DesignCapture.swift", "WM_DESIGN_CAPTURE"),
              "NightlyFlowTests": ("NightlyFlowTests.swift", "WM_NIGHTLY_UI"),
              "GymNightlyFlowTests": ("GymNightlyFlowTests.swift", "WM_NIGHTLY_UI"),
          }
          for name, (file, variable) in opt_in.items():
              guard = f'try XCTSkipUnless(ProcessInfo.processInfo.environment["{variable}"] == "1"'
              assert classes.pop(name, 0) == 1 and guard in (tests / file).read_text(), f"{name} must stay opt-in behind {variable}"
          selection = lambda workflow: Counter(re.findall(r"-only-testing:WindmillUITests/(\w+)", (workflows / workflow).read_text()))
          selected, nightly = selection("ios.yml"), selection("ios-nightly.yml")
          assert classes and selected == classes, f"UI shard coverage differs: classes={classes}, selected={selected}"
          assert nightly == Counter(["NightlyFlowTests", "GymNightlyFlowTests"]), f"iOS nightly selects {nightly}"
          PY

      # Sources/SyncSchema is generated from the product registries and checked in; a stale file fails here.
      - name: Check the generated registry
        run: swift run --explicit-target-dependency-import-check error SyncSchemaGen --check

      # Property tests draw a fresh seed each run; a failure names it, and SYNC_SEED=<seed> replays it. A pull request
      # runs 32 seeds of the replay fuzz; main runs 128, the size that also holds its coverage floor.
      - name: Test on macOS
        env:
          SYNC_SIM_SEEDS: ${{ github.event_name == 'pull_request' && '32' || '128' }}
        run: swift test --explicit-target-dependency-import-check error

      # The runners are Apple silicon, so a simulator build compiles the arm64 slice alone. The App build below compiles
      # every Sync library for the simulator; the unit tests compile SyncTesting.
      - name: Build the SyncProbe app for the iOS simulator
        working-directory: apps/ios/SyncProbe
        run: |
          xcodegen generate
          xcodebuild build -project SyncProbe.xcodeproj -scheme SyncProbe -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath "$WM_SOURCE_PACKAGES/SyncProbe" ARCHS=arm64

      # Sources/GymDomain/Coach/Catalog.generated.swift is generated from the gym ability catalog and checked in; a stale
      # file fails here.
      - name: Check the generated ability catalog
        working-directory: apps/ios/Domain
        run: swift run --explicit-target-dependency-import-check error GymCatalogGen --check

      # The domain kit's tests include the layering checks over every package under apps/ios.
      - name: Test the domain kit
        id: domain_tests
        working-directory: apps/ios/Domain
        run: |
          touch "$RUNNER_TEMP/domain-tests-start"
          set -o pipefail
          swift test --explicit-target-dependency-import-check error 2>&1 | tee "$RUNNER_TEMP/domain-tests.log"

      - name: Reproduce failed Domain tests under LLDB
        if: ${{ failure() && steps.domain_tests.outcome == 'failure' }}
        timeout-minutes: 7
        run: python3 ../App/Tools/domain_ci_debugger.py --output "$RUNNER_TEMP/domain-test-diagnostics"

      - name: Collect failed Domain test diagnostics
        if: ${{ failure() && steps.domain_tests.outcome == 'failure' }}
        timeout-minutes: 2
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import time

          temporary = Path(os.environ["RUNNER_TEMP"])
          output = temporary / "domain-test-diagnostics"
          output.mkdir(exist_ok=True)
          started = (temporary / "domain-tests-start").stat().st_mtime
          limit = 8 * 1024 * 1024
          log = temporary / "domain-tests.log"
          if log.is_file():
              with log.open("rb") as handle:
                  handle.seek(max(0, log.stat().st_size - limit))
                  (output / "domain-tests.log").write_bytes(handle.read(limit))
          reports = Path.home() / "Library/Logs/DiagnosticReports"
          selected = []
          keys = ("procName", "procPath", "procLaunch", "captureTime", "cpuType", "osVersion",
                  "exception", "termination", "faultingThread", "threads", "usedImages")
          for attempt in range(5):
              candidates = [path for pattern in ("WindmillDomainPackageTests-*.ips", "xctest-*.ips", "swiftpm-testing-helper-*.ips")
                            for path in reports.glob(pattern) if not path.is_symlink() and path.is_file()]
              for path in sorted(candidates, key=lambda item: item.stat().st_mtime, reverse=True)[:30]:
                  try:
                      if path.stat().st_mtime < started or path.stat().st_size > limit:
                          continue
                      metadata, payload = path.read_text().split("\n", 1)
                      metadata = json.loads(metadata)
                      if not isinstance(metadata, dict) or str(metadata.get("bug_type")) != "309":
                          continue
                      report = json.loads(payload)
                      if not isinstance(report, dict):
                          continue
                      process = report.get("procName")
                      domain = process == "WindmillDomainPackageTests" or (process in ("xctest", "swiftpm-testing-helper") and any(
                          isinstance(image, dict) and "/WindmillDomainPackageTests.xctest/" in image.get("path", "")
                          for image in report.get("usedImages", [])))
                      if not domain:
                          continue
                      encoded = (json.dumps({key: report[key] for key in keys if key in report}, indent=2) + "\n").encode()
                      if len(encoded) > limit:
                          continue
                      target = output / f"domain-crash-{len(selected) + 1}.json"
                      target.write_bytes(encoded)
                      selected.append(target.name)
                      if len(selected) == 3:
                          break
                  except (OSError, ValueError, TypeError):
                      continue
              if selected or attempt == 4:
                  break
              time.sleep(4)
          summary = {"reports": selected, "maximumReportBytes": limit, "maximumLogBytes": limit}
          (output / "summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          print(f"Collected {len(selected)} Domain test crash report(s); log tail is limited to {limit} bytes.")
          PY

      - name: Retain failed Domain test diagnostics
        if: ${{ failure() && steps.domain_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-domain-test-diagnostics-${{ github.run_attempt }}
          path: ${{ runner.temp }}/domain-test-diagnostics
          retention-days: 3

      - name: Test the engine's public test surface from outside the engine package
        working-directory: apps/ios/SyncTestingSurface
        run: swift test --explicit-target-dependency-import-check error

      # The unit and UI jobs build Debug; this is the one Release compile before a TestFlight archive.
      - name: Check the App tools and build Release
        working-directory: apps/ios/App
        env:
          IOS_SENTRY_DSN: https://nonproduction@example.invalid/1
        run: |
          python3 -m unittest discover -s Tools/tests -v
          python3 Tools/generate_project.py
          xcodebuild build -project Windmill.xcodeproj -scheme Windmill -configuration Release \
            -destination 'generic/platform=iOS Simulator' -clonedSourcePackagesDirPath "$WM_SOURCE_PACKAGES/App" ARCHS=arm64

  app-unit-tests:
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/ios/App
    env:
      IOS_SENTRY_DSN: https://nonproduction@example.invalid/1
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install xcodegen

      # The unit-test scheme leaves out the UI-test bundle and its runner.
      - name: Build and run App unit tests
        run: |
          python3 Tools/generate_project.py
          xcodebuild test -project Windmill.xcodeproj -scheme WindmillUnitTests \
            -destination 'platform=iOS Simulator,name=iPhone 17'

  # Three shards balanced on measured test times. Five macOS jobs is the most that run at once, so a fourth shard would
  # queue rather than shorten the run.
  app-ui-tests:
    name: App UI tests (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: gym-integration
            tests: >-
              -only-testing:WindmillUITests/GymIntegrationFlowTests
              -only-testing:WindmillUITests/GymRecoveryFlowTests
          - shard: gym-journal
            tests: >-
              -only-testing:WindmillUITests/GymCoachFlowTests
              -only-testing:WindmillUITests/GymAnonymousCoachFlowTests
              -only-testing:WindmillUITests/GymWorkoutFlowTests
              -only-testing:WindmillUITests/JournalFlowTests
              -only-testing:WindmillUITests/JournalEchoFlowTests
          - shard: shell-offline-system
            tests: >-
              -only-testing:WindmillUITests/OfflineFlowTests
              -only-testing:WindmillUITests/OnboardingFlowTests
              -only-testing:WindmillUITests/ShellFlowTests
              -only-testing:WindmillUITests/WorkoutActivityFlowTests
              -only-testing:WindmillUITests/WorkoutOutsideFlowTests
    uses: ./.github/workflows/ios-ui-tests.yml
    with:
      shard: ${{ matrix.shard }}
      tests: ${{ matrix.tests }}
