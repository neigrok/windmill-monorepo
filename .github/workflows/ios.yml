name: iOS CI

# Monorepo: the native superapp lives under apps/ios. Build and test only — this workflow ships
# nothing; App Store delivery is a later wave. Path-filtered to apps/ios and packages/api-contract:
# the weight ladder's truth is packages/api-contract/gym-ladder.json and all three copies of the
# rule (Swift, web and Kotlin) run it as a test, so editing the golden fires this workflow AND
# web.yml AND android.yml — web.yml's `npm run build` runs the JS suite first. That is the drift
# gate doing its job — a rule changed in one language fails in the others. All three arm on push
# and on pull_request, so no language can be the only one watching.
#
# This runs xcodebuild against a simulator rather than `swift build`: the package is iOS-only (see
# apps/ios/README.md), and building the app target is a far stronger gate than compiling the
# libraries was — it proves project.yml, the generated Info.plist and the module wiring too.

on:
  push:
    branches: [main]
    paths:
      - 'apps/ios/**'
      - 'packages/api-contract/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'apps/ios/**'
      - 'packages/api-contract/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/ios

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Printed so a red build can be read against the exact toolchain that produced it.
      - run: xcodebuild -version

      # Windmill.xcodeproj is generated, never committed — a pbxproj nobody can review is a merge
      # conflict waiting to happen. project.yml is the reviewable half.
      - name: Generate the project from project.yml
        run: |
          brew install xcodegen
          xcodegen generate

      # Resolve a simulator by capability rather than by name: the runner image's device list moves
      # with every Xcode release, and a hard-coded "iPhone 16" is a build that breaks on a date
      # nobody chose.
      - name: Pick a simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys;ds=json.load(sys.stdin)['devices'];print(next(d['udid'] for rs in ds.values() for d in rs if d['name'].startswith('iPhone')))")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep -m1 iPhone

      # The app target: proves project.yml, the generated Info.plist and the module wiring.
      - name: Build the app
        run: |
          xcodebuild build -project Windmill.xcodeproj -scheme Windmill \
            -destination "id=${{ steps.sim.outputs.udid }}" CODE_SIGNING_ALLOWED=NO

      # The suites, including the ladder against packages/api-contract/gym-ladder.json. That test
      # reads the golden out of the checkout by walking up from #filePath, so the whole repo must be
      # present — never a bundled resource copy.
      # Run from the package directory: WindmillKit-Package is the package's own implicit scheme and
      # does not exist in Windmill.xcodeproj.
      - name: Test WindmillKit
        working-directory: apps/ios/WindmillKit
        run: |
          xcodebuild test -scheme WindmillKit-Package \
            -destination "id=${{ steps.sim.outputs.udid }}"
