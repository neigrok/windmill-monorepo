name: iOS CI

# Tests and builds the Swift sync engine package, apps/ios/Sync; ships nothing. Its corpus runner reads
# packages/api-contract/sync by walking up from #filePath, so the whole repository is checked out and a
# change to the sync contract runs this workflow too.

on:
  push:
    branches: [main]
    paths:
      - 'apps/ios/**'
      - 'packages/api-contract/sync/**'
      - '.github/workflows/ios.yml'
      - '!apps/ios/**/*.md'
  pull_request:
    paths:
      - 'apps/ios/**'
      - 'packages/api-contract/sync/**'
      - '.github/workflows/ios.yml'
      - '!apps/ios/**/*.md'
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/ios/Sync

jobs:
  test-and-build:
    # swift-tools-version 6.2 needs Xcode 26.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - run: |
          xcodebuild -version
          swift --version

      # Property tests draw a fresh seed each run; a failure names it, and SYNC_SEED=<seed> replays it.
      - name: Test on macOS
        run: swift test --explicit-target-dependency-import-check error

      - name: Build for the iOS simulator
        run: xcodebuild build -scheme WindmillSync-Package -destination 'generic/platform=iOS Simulator'
