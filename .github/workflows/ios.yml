name: iOS CI

# Tests and builds the Swift packages under apps/ios — the sync engine (Sync), the domain kit (Domain)
# and the engine's public-surface test (SyncTestingSurface) — and builds the product and dev-only SyncProbe apps for
# the simulator. App unit tests and three class-based UI shards run in parallel; ships nothing. The corpus runners read
# packages/api-contract/{sync,domain-kit,gym,journal} by walking up from #filePath, and the
# SyncSchema target is generated from the registries there, so the whole repository is checked out and a
# change to any of those contracts runs this workflow too.

on:
  push:
    branches: [main]
    paths:
      - 'apps/ios/**'
      - 'packages/api-contract/sync/**'
      - 'packages/api-contract/domain-kit/**'
      - 'packages/api-contract/gym/**'
      - 'packages/api-contract/journal/**'
      - 'packages/api-contract/gym-ladder.json'
      - '.github/workflows/ios.yml'
      - '!apps/ios/**/*.md'
  pull_request:
    paths:
      - 'apps/ios/**'
      - 'packages/api-contract/sync/**'
      - 'packages/api-contract/domain-kit/**'
      - 'packages/api-contract/gym/**'
      - 'packages/api-contract/journal/**'
      - 'packages/api-contract/gym-ladder.json'
      - '.github/workflows/ios.yml'
      - '!apps/ios/**/*.md'
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # swift-tools-version 6.2 and swift-syntax 602 need this pinned compiler.
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  TZ: UTC

defaults:
  run:
    working-directory: apps/ios/Sync

jobs:
  packages-and-builds:
    runs-on: macos-26
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v5

      # The repository pins one toolchain: the domain kit's layering tests read sources with swift-syntax
      # 602, which must match the compiler's major (Swift 6.2), and its compile attacks assert what that
      # compiler refuses. Moving to a newer Xcode means bumping swift-syntax and re-checking the attacks.
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - run: |
          xcodebuild -version
          swift --version

      # The probe app's project is generated from project.yml, and the domain kit's layering tests
      # resolve it and their app fixtures with XcodeGen.
      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Check UI shard coverage
        run: |
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path
          import re

          classes = Counter(name for source in Path("../App/UITests").rglob("*.swift")
                            for name in re.findall(r"\bclass\s+(\w+)\s*:\s*XCTestCase", source.read_text()))
          workflow = Path("../../../.github/workflows/ios.yml").read_text()
          selected = Counter(re.findall(r"-only-testing:WindmillUITests/(\w+)", workflow))
          assert classes and selected == classes, f"UI shard coverage differs: classes={classes}, selected={selected}"
          PY

      # Sources/SyncSchema is generated from the product registries and checked in; a stale file fails here.
      - name: Check the generated registry
        run: swift run --explicit-target-dependency-import-check error SyncSchemaGen --check

      # Property tests draw a fresh seed each run; a failure names it, and SYNC_SEED=<seed> replays it.
      - name: Test on macOS
        run: swift test --explicit-target-dependency-import-check error

      - name: Build for the iOS simulator
        run: xcodebuild build -scheme WindmillSync-Package -destination 'generic/platform=iOS Simulator'

      - name: Build the SyncProbe app for the iOS simulator
        working-directory: apps/ios/SyncProbe
        run: |
          xcodegen generate
          xcodebuild build -project SyncProbe.xcodeproj -scheme SyncProbe -destination 'generic/platform=iOS Simulator'

      # The domain kit's tests include the layering checks over every package under apps/ios.
      - name: Test the domain kit
        working-directory: apps/ios/Domain
        run: swift test --explicit-target-dependency-import-check error

      - name: Test the engine's public test surface from outside the engine package
        working-directory: apps/ios/SyncTestingSurface
        run: swift test --explicit-target-dependency-import-check error

      - name: Check the App tools and build Debug and Release
        working-directory: apps/ios/App
        env:
          IOS_SENTRY_DSN: https://nonproduction@example.invalid/1
        run: |
          python3 -m unittest discover -s Tools/tests -v
          python3 Tools/generate_project.py
          xcodebuild build -project Windmill.xcodeproj -scheme Windmill -destination 'generic/platform=iOS Simulator'
          xcodebuild build -project Windmill.xcodeproj -scheme Windmill -configuration Release \
            -destination 'generic/platform=iOS Simulator'

  app-unit-tests:
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/ios/App
    env:
      IOS_SENTRY_DSN: https://nonproduction@example.invalid/1
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install xcodegen

      - name: Build and run App unit tests
        run: |
          python3 Tools/generate_project.py
          xcodebuild test -project Windmill.xcodeproj -scheme Windmill \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -only-testing:WindmillTests

  app-ui-tests:
    name: App UI tests (${{ matrix.shard }})
    runs-on: macos-26
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: log-workout-account
            timeout: 85
            tests: >-
              -only-testing:WindmillUITests/GymLogFlowTests
              -only-testing:WindmillUITests/GymWorkoutFlowTests
              -only-testing:WindmillUITests/AppleLinkingFlowTests
          - shard: routines-journal
            timeout: 75
            tests: >-
              -only-testing:WindmillUITests/GymRoutinesFlowTests
              -only-testing:WindmillUITests/JournalFlowTests
              -only-testing:WindmillUITests/WorkoutActivityFlowTests
          - shard: coach-shell
            timeout: 95
            tests: >-
              -only-testing:WindmillUITests/GymCoachFlowTests
              -only-testing:WindmillUITests/GymIntegrationFlowTests
              -only-testing:WindmillUITests/OnboardingFlowTests
              -only-testing:WindmillUITests/ShellFlowTests
    defaults:
      run:
        working-directory: apps/ios/App
    env:
      IOS_SENTRY_DSN: https://nonproduction@example.invalid/1
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install xcodegen

      - name: Create and prepare the UI simulator
        timeout-minutes: 10
        env:
          UI_SHARD: ${{ matrix.shard }}
          SIMCTL_CHILD_TZ: UTC
        run: |
          UI_SIMULATOR=$(xcrun simctl create "Windmill CI $UI_SHARD" \
            com.apple.CoreSimulator.SimDeviceType.iPhone-17 com.apple.CoreSimulator.SimRuntime.iOS-26-5)
          echo "UI_SIMULATOR=$UI_SIMULATOR" >> "$GITHUB_ENV"
          export UI_SIMULATOR
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import os
          import plistlib

          preferences = Path.home() / "Library/Developer/CoreSimulator/Devices" / os.environ["UI_SIMULATOR"] / "data/Library/Preferences"
          preferences.mkdir(parents=True, exist_ok=True)
          now = datetime.now(timezone.utc)
          policies = {
              ".GlobalPreferences": {
                  "AppleLanguages": ["en"], "AppleLocale": "en_US",
                  "KeyboardAutocorrection": False, "KeyboardPrediction": False,
                  "KeyboardContinuousPathEnabled": False,
              },
              "com.apple.Accessibility": {
                  "ApplicationAccessibilityEnabled": True, "AutomationEnabled": True,
              },
              # iOS 26.5 keeps Live Activity consent outside simctl privacy's services.
              "com.apple.liveactivitiesd": {
                  "AppAuthorizationRecords": {"works.windmill.app": True},
                  "FirstResponseRecords": ["works.windmill.app"],
                  "SecondResponseRecords": ["works.windmill.app"],
              },
              # Mark the first-boot Settings notifications as already delivered.
              "com.apple.generativeexperiences.corefollowup": {
                  "DateOfLastAppleIntelligenceReadinessCFU": now.replace(tzinfo=None),
                  "DateOfLastNotificationAutoEnablement": (now - datetime(2001, 1, 1, tzinfo=timezone.utc)).total_seconds(),
              },
          }
          for domain, settings in policies.items():
              path = preferences / f"{domain}.plist"
              current = plistlib.loads(path.read_bytes()) if path.exists() else {}
              path.write_bytes(plistlib.dumps(current | settings))
          PY
          xcrun simctl boot "$UI_SIMULATOR"
          xcrun simctl bootstatus "$UI_SIMULATOR" -b
          xcrun simctl spawn "$UI_SIMULATOR" launchctl setenv TZ UTC
          xcrun simctl ui "$UI_SIMULATOR" appearance light
          xcrun simctl ui "$UI_SIMULATOR" content_size large
          xcrun simctl status_bar "$UI_SIMULATOR" override --time '9:41' \
            --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          xcrun simctl getenv "$UI_SIMULATOR" TZ
          xcrun simctl spawn "$UI_SIMULATOR" defaults read NSGlobalDomain AppleLanguages
          xcrun simctl spawn "$UI_SIMULATOR" defaults read NSGlobalDomain AppleLocale
          test "$(xcrun simctl spawn "$UI_SIMULATOR" defaults read com.apple.Accessibility ApplicationAccessibilityEnabled)" = 1
          test "$(xcrun simctl spawn "$UI_SIMULATOR" defaults read com.apple.Accessibility AutomationEnabled)" = 1
          xcrun simctl spawn "$UI_SIMULATOR" defaults read com.apple.liveactivitiesd

      - name: Build and run the UI shard
        shell: bash
        run: |
          python3 Tools/generate_project.py
          xcodebuild test -project Windmill.xcodeproj -scheme Windmill \
            -destination "platform=iOS Simulator,id=$UI_SIMULATOR" \
            -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 \
            -testLanguage en -testRegion US \
            -resultBundlePath "$RUNNER_TEMP/ios-ui-${{ matrix.shard }}.xcresult" \
            ${{ matrix.tests }} 2>&1 | tee "$RUNNER_TEMP/ios-ui-${{ matrix.shard }}.log"

      - name: Check every selected UI test ran once
        env:
          UI_TEST_SELECTION: ${{ matrix.tests }}
          UI_TEST_LOG: ${{ runner.temp }}/ios-ui-${{ matrix.shard }}.log
        run: |
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path
          import os
          import re

          selected = set(re.findall(r"-only-testing:WindmillUITests/(\w+)", os.environ["UI_TEST_SELECTION"]))
          expected = Counter()
          for source in Path("UITests").rglob("*.swift"):
              text = source.read_text()
              classes = re.findall(r"\bclass\s+(\w+)\s*:\s*XCTestCase", text)
              if not classes or classes[0] not in selected:
                  continue
              assert len(classes) == 1, f"Expected one UI test class in {source}"
              expected.update((classes[0], method) for method in re.findall(r"\bfunc\s+(test\w+)\s*\(", text))
          log = Path(os.environ["UI_TEST_LOG"]).read_text()
          started = Counter(re.findall(r"Test Case '-\[WindmillUITests\.(\w+) (test\w+)\]' started\.", log))
          passed = Counter(re.findall(r"Test Case '-\[WindmillUITests\.(\w+) (test\w+)\]' passed ", log))
          assert expected and started == expected, f"UI executions differ: expected={expected}, started={started}"
          assert passed == expected, f"UI results differ: expected={expected}, passed={passed}"
          print(f"All {sum(expected.values())} selected UI tests passed exactly once.")
          PY

      - name: Retain failed UI test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-${{ matrix.shard }}-result
          path: |
            ${{ runner.temp }}/ios-ui-${{ matrix.shard }}.xcresult
            ${{ runner.temp }}/ios-ui-${{ matrix.shard }}.log
          retention-days: 3

      - name: Delete the UI simulator
        if: ${{ always() && env.UI_SIMULATOR != '' }}
        timeout-minutes: 2
        run: xcrun simctl delete "$UI_SIMULATOR"
