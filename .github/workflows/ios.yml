name: iOS CI

# Build and test only; ships nothing. Editing packages/api-contract/gym-ladder.json fires this
# workflow, web.yml and android.yml: all three languages run the ladder rule against that golden.
# xcodebuild against a simulator rather than `swift build` — the package is iOS-only.

on:
  push:
    branches: [main]
    paths:
      - 'apps/ios/**'
      - 'packages/api-contract/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'apps/ios/**'
      - 'packages/api-contract/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/ios

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - run: xcodebuild -version

      # Windmill.xcodeproj is generated, never committed; project.yml is the checked-in half.
      - name: Generate the project from project.yml
        run: |
          brew install xcodegen
          xcodegen generate

      # Resolve a simulator by capability, never by name: the runner image's device list moves with
      # every Xcode release.
      - name: Pick a simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys;ds=json.load(sys.stdin)['devices'];print(next(d['udid'] for rs in ds.values() for d in rs if d['name'].startswith('iPhone')))")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep -m1 iPhone

      - name: Build the app
        run: |
          xcodebuild build -project Windmill.xcodeproj -scheme Windmill \
            -destination "id=${{ steps.sim.outputs.udid }}" CODE_SIGNING_ALLOWED=NO

      # The ladder test reads packages/api-contract/gym-ladder.json by walking up from #filePath, so
      # the whole repo must be checked out. Run from the package directory: WindmillKit-Package is
      # the package's implicit scheme and does not exist in Windmill.xcodeproj.
      - name: Test WindmillKit
        working-directory: apps/ios/WindmillKit
        run: |
          xcodebuild test -scheme WindmillKit-Package \
            -destination "id=${{ steps.sim.outputs.udid }}"
