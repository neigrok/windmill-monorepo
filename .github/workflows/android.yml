name: Android CI

# GitHub does not evaluate the paths filter for tag pushes: the paths list gates branch pushes only.

on:
  push:
    branches: [main]
    tags: ['android-v*']
    paths:
      - 'apps/android/**'
      - 'packages/api-contract/**'
      - '.github/workflows/android.yml'
      - '!apps/android/**/*.md'
  pull_request:
    paths:
      - 'apps/android/**'
      - 'packages/api-contract/**'
      - '.github/workflows/android.yml'
      - '!apps/android/**/*.md'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for an unpublished signing-input candidate (e.g. 0.8.0); local signing and acceptance are required'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/android

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The runner image ships the Android SDK with licenses pre-accepted; only the JDK needs picking.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - run: python3 -m unittest discover -s tools/tests -v

      # The ladder test finds packages/api-contract/gym-ladder.json by walking up from the project
      # directory, so the whole repo must be checked out.
      - run: ./gradlew build
        env:
          ANDROID_SENTRY_DSN: https://ci-placeholder@telemetry.invalid/1

  signing-input:
    if: startsWith(github.ref, 'refs/tags/android-v') || github.event_name == 'workflow_dispatch'
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install APK verification tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" "build-tools;36.0.0"

      - name: Prepare the unpublished signing input
        id: candidate
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          umask 077
          python3 tools/release.py prepare

      - name: Assemble the build candidate
        env:
          VERSION: ${{ steps.candidate.outputs.version }}
          ANDROID_SENTRY_DSN: ${{ secrets.ANDROID_SENTRY_DSN }}
        run: |
          umask 077
          if [ -z "$ANDROID_SENTRY_DSN" ]; then
            echo "ANDROID_SENTRY_DSN is required for Android release observability." >&2
            exit 1
          fi
          if ! ./gradlew --no-daemon :app:assembleRelease \
            "-Pwindmill.versionName=$VERSION" \
            "-Pwindmill.versionCode=$GITHUB_RUN_NUMBER" \
            > "$RUNNER_TEMP/windmill-android-candidate-build.log" 2>&1; then
            echo "Build candidate assembly failed; captured build output will be removed." >&2
            exit 1
          fi

      - name: Remove captured build output
        if: always()
        run: |
          rm -f -- "$RUNNER_TEMP/windmill-android-candidate-build.log"

      - name: Verify the unpublished signing input
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          umask 077
          python3 tools/release.py stage \
            --apk-dir app/build/outputs/apk/release --out signing-input \
            --build-tools "$ANDROID_HOME/build-tools/36.0.0"

      - name: Upload the unpublished signing input
        uses: actions/upload-artifact@v5
        with:
          name: windmill-${{ steps.candidate.outputs.version }}-signing-input-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/android/signing-input/
          if-no-files-found: error
