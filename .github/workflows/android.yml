name: Android CI

# GitHub does not evaluate the paths filter for tag pushes: the paths list gates branch pushes only.

on:
  push:
    branches: [main]
    tags: ['android-v*']
    paths:
      - 'apps/android/**'
      - 'packages/api-contract/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'apps/android/**'
      - 'packages/api-contract/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name for a dry-run release build (e.g. 0.2.0); the APK lands as an actions artifact, no release is created'
        required: true
        type: string

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/android

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The runner image ships the Android SDK with licenses pre-accepted; only the JDK needs picking.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # The ladder test finds packages/api-contract/gym-ladder.json by walking up from the project
      # directory, so the whole repo must be checked out.
      - run: ./gradlew build

  release:
    if: startsWith(github.ref, 'refs/tags/android-v') || github.event_name == 'workflow_dispatch'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Resolve the version
        id: ver
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="$DISPATCH_VERSION"
          else
            version="${GITHUB_REF#refs/tags/android-v}"
          fi
          if [ -z "$version" ]; then
            echo "a bare android-v tag names no version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # With no keystore secrets set, app/build.gradle.kts falls back to the debug key.
      - name: Arm signing
        env:
          KEYSTORE_B64: ${{ secrets.WINDMILL_ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WINDMILL_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WINDMILL_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WINDMILL_ANDROID_KEY_PASSWORD }}
        run: |
          present=0
          for v in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v}" ] && present=$((present + 1))
          done
          if [ "$present" -eq 0 ]; then
            echo "Signing: **debug key** (keystore secrets not set — sideload-ready, no store identity)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$present" -ne 4 ]; then
            echo "signing secrets are partially set ($present of 4) — set all four or none" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/windmill.keystore"
          {
            echo "WINDMILL_ANDROID_KEYSTORE=$RUNNER_TEMP/windmill.keystore"
            echo "WINDMILL_ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "WINDMILL_ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "WINDMILL_ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Signing: **release keystore**" >> "$GITHUB_STEP_SUMMARY"

      # run_number as versionCode: monotonic, so a later tag never ships a smaller code.
      - name: Assemble the release APK
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          ./gradlew :app:assembleRelease \
            "-Pwindmill.versionName=$VERSION" \
            "-Pwindmill.versionCode=$GITHUB_RUN_NUMBER"
          cp app/build/outputs/apk/release/*.apk "windmill-$VERSION.apk"

      - name: Create the GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: gh release create "$GITHUB_REF_NAME" "windmill-$VERSION.apk" --verify-tag --generate-notes

      - name: Upload the dry-run APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v5
        with:
          name: windmill-${{ steps.ver.outputs.version }}
          path: apps/android/windmill-*.apk
          if-no-files-found: error
