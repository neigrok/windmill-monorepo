# The iOS app target, declared rather than drawn. `Windmill.xcodeproj` is GENERATED from this file
# (`xcodegen generate`) and is not in git: a pbxproj is a binary-shaped merge conflict waiting to
# happen, and nobody can review one. This file is the reviewable half — the app is a thin shell over
# WindmillKit next door, so there is very little of it.
#
#   brew install xcodegen && cd apps/ios && xcodegen generate && open Windmill.xcodeproj

name: Windmill

options:
  bundleIdPrefix: works.windmill
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  WindmillKit:
    path: WindmillKit

targets:
  Windmill:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: WindmillKit
        product: WindmillPlatform
      - package: WindmillKit
        product: WindmillJournal
      - package: WindmillKit
        product: WindmillRoadmap
      - package: WindmillKit
        product: WindmillGym
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: works.windmill.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # No team is configured here on purpose: a simulator build needs none, and hard-coding
        # someone's personal team id into the repo is how a project stops building for everyone else.
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: App/Info.generated.plist
      properties:
        CFBundleDisplayName: Windmill
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Where the backend lives — the native VITE_API_BASE_URL. Empty means the production host
        # (WindmillApi.resolvedBaseURL); point it at http://localhost:8088 to run against the local
        # windmill_server, which the ATS exception below is what makes possible.
        WMApiBaseURL: ""
        # Sign in with Apple stays OFF until there is a paid team, the capability, and the four
        # server env vars. Off means the button is absent, never present-and-broken.
        WMAppleSignInEnabled: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
