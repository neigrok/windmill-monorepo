# The iOS app target, declared rather than drawn. `Windmill.xcodeproj` is GENERATED from this file
# (`xcodegen generate`) and is not in git: a pbxproj is a binary-shaped merge conflict waiting to
# happen, and nobody can review one. This file is the reviewable half — the app is a thin shell over
# WindmillKit next door, so there is very little of it.
#
#   brew install xcodegen && cd apps/ios && xcodegen generate && open Windmill.xcodeproj

name: Windmill

options:
  bundleIdPrefix: works.windmill
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  WindmillKit:
    path: WindmillKit
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa.git
    exactVersion: 9.29.0

targets:
  WindmillCrashReportTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/App
      - path: App/CrashReports.swift
    dependencies:
      - package: Sentry
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: works.windmill.app.crash-report-tests
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: "YES"

  # The leading edge means two things — the shell's way home at the room's root, the room's own back
  # once it has pushed — and which one it means can only be settled by a real touch on a real
  # simulator. That is what `UITests` is for; it is run by this scheme's `test` action.
  WindmillUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Windmill
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: works.windmill.app.uitests
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: Windmill

  Windmill:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - WindmillUITests
        - WindmillCrashReportTests
    # App/ carries Assets.xcassets: AppIcon is the single 1024pt universal icon, brand-mark.svg on
    # the cream ground of web/public/icon-512.png, opaque and square — the system draws the corners.
    sources:
      - path: App
    dependencies:
      - package: Sentry
      - package: WindmillKit
        product: WindmillPlatform
      - package: WindmillKit
        product: WindmillJournal
      - package: WindmillKit
        product: WindmillRoadmap
      - package: WindmillKit
        product: WindmillGym
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: works.windmill.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # No team is configured here on purpose: a simulator build needs none, and hard-coding
        # someone's personal team id into the repo is how a project stops building for everyone else.
        # The release workflow (.github/workflows/ios-release.yml) supplies the team and turns
        # signing on from its own command line.
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        IOS_SENTRY_DSN: ""
    preBuildScripts:
      - name: Validate iOS crash reporting
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" != "Release" ]; then exit 0; fi
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          dsn = urlparse(os.environ.get("IOS_SENTRY_DSN", ""))
          if not (dsn.scheme == "https" and dsn.hostname and dsn.username and dsn.path.strip("/").isdigit()):
              raise SystemExit("error: Release crash reporting requires a valid IOS_SENTRY_DSN build setting for the iOS Sentry project.")
          PY
    # The app's claim on windmill.works links, so the emailed magic link opens THIS app instead of
    # Safari (Shell.swift's onOpenURL → AuthStore.arrived). The entitlement is the half that lives in
    # the repo; it does nothing on its own. iOS only honours it when the DOMAIN serves
    # /.well-known/apple-app-site-association naming this bundle under a real team id — see the
    # "Universal links" section of README.md for exactly what that file is and who can put it there.
    #
    # An entitlement is not a button, so declaring it early breaks nothing: with no association file
    # the system simply never routes a link here, which is what happens today. Two consequences worth
    # knowing: a simulator/CI build is unaffected (signing is off, entitlements are not applied), and
    # signing for a real DEVICE now needs a paid team with Associated Domains enabled on the App ID —
    # a free personal team cannot use this capability.
    entitlements:
      path: App/Windmill.generated.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:windmill.works
    info:
      path: App/Info.generated.plist
      properties:
        CFBundleDisplayName: Windmill
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # Spelled out, or XcodeGen writes the literal value and a build number passed on the
        # command line never reaches the bundle.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The app uses only the system's own TLS, which is exempt; saying so here answers App Store
        # Connect's export-compliance question for every build.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Where the backend lives — the native VITE_API_BASE_URL. Empty means the production host
        # (WindmillApi.resolvedBaseURL); point it at http://localhost:8088 to run against the local
        # windmill_server, which the ATS exception below is what makes possible.
        WMApiBaseURL: ""
        IOS_SENTRY_DSN: $(IOS_SENTRY_DSN)
        # Sign in with Apple stays OFF until there is a paid team, the capability, and the four
        # server env vars. Off means the button is absent, never present-and-broken.
        WMAppleSignInEnabled: false
        # Whether a tapped windmill.works link actually reaches this app — true only once the
        # association file above is live. Since the code door shipped, no code reads it: the sign-in
        # door asks for an emailed six-digit code and gives no instruction about the link. It stays
        # as the declared truth of the domain half, for the wave that makes a tapped link come home
        # (README.md, "Universal links").
        WMUniversalLinksEnabled: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
