# expect: project Windmill: a build rule (*/Race/*.swift)
name: Windmill
options:
  bundleIdPrefix: works.windmill
  deploymentTarget:
    iOS: "18.0"
targets:
  Windmill:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Race
    buildRules:
      - name: Race in Swift 5
        filePattern: "*/Race/*.swift"
        script: |
          xcrun --sdk "$PLATFORM_NAME" swiftc -swift-version 5 -parse-as-library -module-name Windmill -sdk "$SDKROOT" -target "${CURRENT_ARCH}-apple-ios${IPHONEOS_DEPLOYMENT_TARGET}-simulator" -c "$INPUT_FILE_PATH" -o "$DERIVED_FILE_DIR/$INPUT_FILE_BASE.o"
        outputFiles:
          - $(DERIVED_FILE_DIR)/$(INPUT_FILE_BASE).o
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: works.windmill.app
        CODE_SIGNING_ALLOWED: "NO"
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "6.0"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
        SWIFT_WARNINGS_AS_WARNINGS_GROUPS: DeprecatedDeclaration
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
