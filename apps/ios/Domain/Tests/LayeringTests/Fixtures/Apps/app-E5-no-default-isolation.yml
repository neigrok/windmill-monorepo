# expect: build-settings Windmill [Debug, iphoneos]: default isolation unset
# expect: build-settings Windmill [Debug, iphonesimulator]: default isolation unset
# expect: build-settings Windmill [Release, iphoneos]: default isolation unset
# expect: build-settings Windmill [Release, iphonesimulator]: default isolation unset
# expect: project Windmill: SWIFT_DEFAULT_ACTOR_ISOLATION is not set in the target's own settings
name: Windmill
options:
  bundleIdPrefix: works.windmill
  deploymentTarget:
    iOS: "18.0"
packages:
  WindmillKit:
    path: WindmillKit
targets:
  Windmill:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: WindmillKit
        product: WindmillGym
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: works.windmill.app
        CODE_SIGNING_ALLOWED: "NO"
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "6.0"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
        SWIFT_WARNINGS_AS_WARNINGS_GROUPS: DeprecatedDeclaration
