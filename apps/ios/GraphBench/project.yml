name: GraphBench
options:
  bundleIdPrefix: works.windmill
  deploymentTarget:
    iOS: "18.0"
packages:
  WindmillSync:
    path: ../Sync
  WindmillDomain:
    path: ../Domain
targets:
  GraphBench:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # The Roadmap room's own Graph, its colours and the layout's 5,000-step fixture, each compiled or bundled from where it lives.
      - path: ../App/Sources/Roadmap/Graph/GraphPicture.swift
        group: Room
      - path: ../App/Sources/Roadmap/Graph/GraphCamera.swift
        group: Room
      - path: ../App/Sources/Roadmap/Graph/GraphDrawing.swift
        group: Room
      - path: ../App/Sources/Theme/Palettes.swift
        group: Room
      - path: ../App/Sources/Theme/Theme.xcassets
        group: Room
      - path: ../../../packages/api-contract/roadmap/layout/handbook.json
        group: Room
        buildPhase: resources
    dependencies:
      - package: WindmillSync
        product: SyncCore
      - package: WindmillDomain
        product: RoadmapDomain
      - package: WindmillDomain
        product: RoadmapLayout
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Graph Bench
        UILaunchScreen:
          UIColorName: roadmap/canvas
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: works.windmill.graphbench
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        SWIFT_VERSION: "6.0"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
        SWIFT_WARNINGS_AS_WARNINGS_GROUPS: DeprecatedDeclaration
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        TARGETED_DEVICE_FAMILY: "1"
